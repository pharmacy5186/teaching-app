<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>站別教學指引 · On-the-spot Teaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F1;
  --paper:#FFFFFF;
  --ink:#1C2B26;
  --ink-soft:#5B6B65;
  --line:#E1E7E2;
  --primary:#12655C;
  --primary-dk:#0A423C;
  --primary-tint:#DCEFEA;
  --amber:#DD7A2A;
  --amber-tint:#FBE9D6;
  --danger:#C0432F;
  --danger-tint:#FBE4DF;
  --mint:#CFEEE1; --mint-ink:#0E5E4C;
  --sky:#D3E5F4; --sky-ink:#1B4E78;
  --lav:#E3DBF3; --lav-ink:#4E3B84;
  --peach:#F5DFCF; --peach-ink:#8B4A20;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow:0 2px 10px rgba(18,101,92,0.08), 0 1px 2px rgba(18,101,92,0.06);
  --font-display:'Noto Serif TC', serif;
  --font-body:'Noto Sans TC', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  padding-bottom:78px;
  box-shadow:0 0 40px rgba(0,0,0,0.06);
  overflow-x:hidden;
}
@media(min-width:540px){
  .shell{margin-top:18px; margin-bottom:18px; min-height:calc(100vh - 36px); border-radius:28px; overflow:hidden;}
}
/* ---- top bar ---- */
.topbar{
  background:var(--primary-dk);
  color:#fff;
  padding:16px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.rx-mark{
  width:34px;height:34px;border-radius:10px;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:18px;color:#2A1706;
  flex-shrink:0;
}
.brand h1{font-family:var(--font-display);font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;}
.brand p{margin:0;font-size:10.5px;color:#B9D6CF;letter-spacing:.08em;text-transform:uppercase;}
.topbar .date-chip{
  font-family:var(--font-mono);font-size:11px;color:#CFE7E1;
  background:rgba(255,255,255,0.08);
  padding:5px 9px;border-radius:100px;
  white-space:nowrap;
}
/* ---- bottom nav ---- */
.bottomnav{
  position:fixed;
  bottom:0;left:0;right:0;
  max-width:480px;
  margin:0 auto;
  background:var(--paper);
  border-top:1px solid var(--line);
  display:flex;
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.shell .bottomnav{position:sticky;}
.bottomnav button{
  flex:1;
  background:none;border:none;
  padding:10px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--font-body);font-size:11px;color:var(--ink-soft);
  cursor:pointer;
}
.bottomnav button .ic{font-size:19px;line-height:1;}
.bottomnav button.active{color:var(--primary);}
.bottomnav button.active .ic{transform:translateY(-1px);}

/* ---- generic ---- */
.view{padding:16px 16px 8px;}
h2.page-title{font-family:var(--font-display);font-size:21px;margin:2px 0 3px;color:var(--primary-dk);}
p.page-sub{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}
.card{background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-body);font-weight:700;font-size:13.5px;
  padding:11px 16px;border-radius:100px;border:none;cursor:pointer;
  min-height:44px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dk);}
.btn-ghost{background:var(--primary-tint);color:var(--primary-dk);}
.btn-outline{background:#fff;color:var(--primary-dk);border:1.5px solid var(--primary);}
.btn-amber{background:var(--amber);color:#2A1706;}
.btn-danger{background:var(--danger-tint);color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12px;min-height:34px;}
.pill-tag{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.tag-mint{background:var(--mint);color:var(--mint-ink);}
.tag-sky{background:var(--sky);color:var(--sky-ink);}
.tag-lav{background:var(--lav);color:var(--lav-ink);}
.tag-peach{background:var(--peach);color:var(--peach-ink);}

/* ---- today view ---- */
.greeting{font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--primary-dk);margin:4px 0 2px;}
.greeting-sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
.section-label{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);font-weight:700;font-size:14px;
  color:var(--primary-dk);margin:22px 0 10px;
}
.section-label .dash{flex:1;height:1px;background:var(--line);}
.shift-card{
  background:var(--paper);border-radius:var(--radius-lg);
  border:1px solid var(--line);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:12px;
}
.shift-card .shift-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);
  border-bottom:1px dashed var(--line);
}
.shift-card .shift-body{padding:14px 16px 16px;}
.station-name{font-family:var(--font-display);font-size:17px;font-weight:700;margin:2px 0 10px;color:var(--ink);}
.mentor-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.badge-avatar{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;
  flex-shrink:0;
  background:var(--primary);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12);
}
.mentor-meta p{margin:0;line-height:1.35;}
.mentor-meta .role{font-size:10.5px;color:var(--ink-soft);letter-spacing:.03em;}
.mentor-meta .name{font-size:14px;font-weight:700;}
.progress-mini{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}
.blister{display:flex;gap:3px;}
.blister .cap{width:9px;height:15px;border-radius:5px;background:var(--line);}
.blister .cap.on{background:var(--primary);}
.preview-card{
  background:linear-gradient(135deg,var(--primary-dk),var(--primary));
  color:#fff;border-radius:var(--radius-lg);padding:14px 16px;margin-top:6px;
}
.preview-card h4{margin:2px 0 6px;font-family:var(--font-display);font-size:14px;}
.preview-card p{margin:0 0 10px;font-size:12px;color:#C9E4DD;line-height:1.5;}
.empty-note{
  background:var(--amber-tint);color:#7A3F0C;border-radius:var(--radius-md);
  padding:12px 14px;font-size:12.5px;line-height:1.5;
}

/* ---- station list ---- */
.station-list-card{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;
}
.station-emoji{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.station-list-card .info{flex:1;min-width:0;}
.station-list-card .info .top-row{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.station-list-card .info .name{font-family:var(--font-display);font-weight:700;font-size:15px;}
.station-list-card .info .meta{font-size:11.5px;color:var(--ink-soft);}
.chev{color:var(--ink-soft);font-size:18px;}

/* ---- station detail ---- */
.back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.back-btn{background:none;border:none;color:var(--primary-dk);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;padding:6px 0;}
.station-select{font-family:var(--font-body);font-size:12px;border:1px solid var(--line);border-radius:100px;padding:6px 10px;background:#fff;color:var(--ink);}
.station-header{
  border-radius:var(--radius-lg);padding:16px 18px 18px;color:#fff;position:relative;overflow:hidden;
  margin-bottom:16px;
}
.station-header .shift-badge{
  display:inline-block;background:rgba(255,255,255,0.22);padding:3px 10px;border-radius:100px;font-size:10.5px;font-weight:700;letter-spacing:.03em;margin-bottom:8px;
}
.station-header h3{font-family:var(--font-display);font-size:20px;margin:0 0 2px;}
.station-header .mentor-line{font-size:12px;color:rgba(255,255,255,0.85);margin-bottom:14px;}
.station-header .mentor-line b{color:#fff;}
.blister-row{display:flex;gap:4px;margin-bottom:6px;}
.blister-row .cap{flex:1;height:16px;border-radius:6px;background:rgba(255,255,255,0.25);}
.blister-row .cap.on{background:#fff;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;font-family:var(--font-mono);color:rgba(255,255,255,0.9);}

.block-title{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--primary-dk);margin:0 0 10px;}
.hint-banner{
  background:var(--amber-tint);color:#7A3F0C;font-size:11.5px;padding:8px 12px;border-radius:var(--radius-sm);
  margin-bottom:12px;display:flex;gap:6px;align-items:flex-start;line-height:1.4;
}
.tp-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:13px 14px;margin-bottom:10px;
  border-left:4px solid var(--primary);
}
.tp-card h5{margin:0 0 6px;font-size:13.5px;font-weight:700;}
.tp-card ul{margin:0 0 10px;padding-left:18px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.tp-card ul li::marker{color:var(--primary);}

.cat-block{margin-bottom:16px;}
.cat-title{
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:8px;
}
.cat-num{
  width:20px;height:20px;border-radius:6px;background:var(--primary-tint);color:var(--primary-dk);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
}
.check-row{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:11px 12px;margin-bottom:8px;
}
.check-row.important{border-color:#EBC3B7;background:#FEFAF8;}
.check-row input[type=checkbox]{
  width:20px;height:20px;margin-top:1px;accent-color:var(--primary);flex-shrink:0;cursor:pointer;
}
.check-row .txt{flex:1;cursor:pointer;}
.check-row .txt .line{font-size:13px;line-height:1.45;white-space:pre-line;}
.check-row.checked .line{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line);}
.check-row .note{font-size:11px;color:var(--danger);margin-top:3px;font-weight:700;}
.info-dot{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dk);
  font-size:10px;font-weight:700;margin-left:5px;vertical-align:middle;
}
.reset-row{text-align:center;margin-top:6px;margin-bottom:20px;}
.reset-row button{background:none;border:none;color:var(--ink-soft);font-size:11.5px;text-decoration:underline;cursor:pointer;}

/* ---- modal ---- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,25,22,0.55);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;
  padding:0;
}
@media(min-width:540px){.modal-overlay{align-items:center;}}
.modal-box{
  background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;padding:20px 20px 26px;
  animation:slideup .18s ease-out;
}
@media(min-width:540px){.modal-box{border-radius:20px;}}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-box .modal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.modal-box h4{font-family:var(--font-display);font-size:17px;margin:0;padding-right:10px;line-height:1.4;}
.modal-close{background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;color:var(--ink-soft);}
.modal-summary{background:var(--danger-tint);color:var(--danger);padding:9px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;margin-bottom:12px;}
.modal-steps{margin:0 0 14px;padding-left:20px;font-size:13px;line-height:1.75;color:var(--ink);}
.modal-img{width:100%;border-radius:var(--radius-md);margin-bottom:6px;display:block;background:var(--bg);}
.modal-img-cap{font-size:11px;color:var(--ink-soft);text-align:center;margin-bottom:10px;}
.pdf-viewer{margin-bottom:10px;}
.pdf-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 6px;}
.pdf-page-label{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}

/* ---- admin ---- */
.admin-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:4px;}
.admin-tabs button{
  flex:1;border:none;background:none;padding:8px 4px;border-radius:100px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;
}
.admin-tabs button.active{background:var(--primary);color:#fff;}
.admin-station-row{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:12px;margin-bottom:10px;
}
.admin-station-row .info{flex:1;}
.admin-station-row .name{font-weight:700;font-size:13.5px;}
.admin-station-row .meta{font-size:11px;color:var(--ink-soft);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.form-group input[type=text],.form-group input[type=date],.form-group select,.form-group textarea{
  width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:var(--font-body);background:#fff;color:var(--ink);
}
.form-group textarea{min-height:70px;resize:vertical;}
.color-picker{display:flex;gap:8px;}
.color-swatch{width:32px;height:32px;border-radius:9px;cursor:pointer;border:2px solid transparent;}
.color-swatch.sel{border-color:var(--ink);}
.chk-inline{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:10px;}
.chk-inline input{width:17px;height:17px;accent-color:var(--primary);}
.admin-item-row{
  display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--radius-sm);padding:9px 10px;margin-bottom:6px;
}
.admin-item-row .t{flex:1;font-size:12.5px;}
.admin-item-row .badges{display:flex;gap:4px;}
.mini-x{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:2px 4px;}
.mini-edit{background:none;border:none;color:var(--primary);cursor:pointer;font-size:12px;padding:2px 4px;font-weight:700;}
.subhead{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
table.sched-table{width:100%;border-collapse:collapse;font-size:12px;}
table.sched-table th{text-align:left;color:var(--ink-soft);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px;}
table.sched-table td{padding:8px 4px;border-bottom:1px solid var(--line);}
.csv-box{
  border:1.5px dashed var(--line);border-radius:var(--radius-md);padding:14px;text-align:center;background:var(--bg);margin-bottom:12px;
}
.csv-example{
  background:var(--ink);color:#CFE7E1;font-family:var(--font-mono);font-size:11px;border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0;overflow-x:auto;white-space:pre;
}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:100px;font-size:12.5px;z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
}
.otp-row{
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:text;position:relative;
}
.otp-prefix{
  font-family:var(--font-display);font-weight:700;font-size:32px;color:var(--primary-dk);
}
.otp-boxes{position:relative;display:flex;gap:8px;}
.otp-box{
  width:44px;height:56px;border:2px solid var(--line);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--ink);
  background:#fff;
}
.otp-box.filled{border-color:var(--primary);background:var(--primary-tint);}
.otp-hidden-input{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;
}
.login-field-label{
  display:block;font-size:13px;font-weight:700;color:var(--primary-dk);margin-bottom:7px;
}
.login-id-row{
  display:flex;align-items:stretch;gap:10px;min-width:0;
}
.login-y-badge{
  width:56px;flex-shrink:0;border-radius:var(--radius-md);background:var(--primary-tint);color:var(--primary-dk);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;
}
.login-id-input{
  flex:1 1 0%;min-width:0;width:100%;border:2px solid var(--primary);border-radius:var(--radius-md);
  font-family:var(--font-mono);font-size:26px;letter-spacing:.12em;text-align:center;color:var(--ink);
  background:#fff;padding:0 6px;
}
.login-id-input::placeholder{color:var(--line);}
.login-name-box{
  border-radius:var(--radius-md);background:var(--primary-tint);color:var(--ink-soft);
  padding:14px 16px;font-size:15px;min-height:24px;
}
.login-name-box.resolved{color:var(--primary-dk);font-weight:700;background:var(--mint);}
.login-name-box.notfound{color:var(--danger);background:var(--danger-tint);}
</style>

// 唯讀工具函式：只讀取，絕不寫入。這裡刻意不提供任何 set/update/delete 的包裝函式。
async function scheduleReadCollection(collectionName, limitN){
  if(!scheduleDbReady) throw new Error('班表系統尚未連線');
  let q = scheduleDb.collection(collectionName);
  if(limitN) q = q.limit(limitN);
  const snap = await q.get();
  return snap.docs.map(d=>({id:d.id, data:d.data()}));
}
async function scheduleReadDoc(collectionName, docId){
  if(!scheduleDbReady) throw new Error('班表系統尚未連線');
  const doc = await scheduleDb.collection(collectionName).doc(docId).get();
  return doc.exists ? {id:doc.id, data:doc.data()} : null;
}

}

  const w=['日','一','二','三','四','五','六'];

/* =========================================================
   檔案上傳工具（圖片 / PDF / Word）— 上傳到 Firebase Storage
   ========================================================= */
const MAX_ATTACHMENT_BYTES = 8 * 1024 * 1024; // 單檔上限 8MB（實際內容存在 Storage，不受 Firestore 1MB 文件限制）
function humanFileSize(bytes){
  if(bytes < 1024*1024) return Math.round(bytes/1024)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
async function uploadFileToStorage(path, fileOrBlob){
  if(!firebaseReady) throw new Error('Firebase 尚未設定完成，無法上傳檔案');
  const ref = storageRef.child(path);
  const snapshot = await ref.put(fileOrBlob);
  return await snapshot.ref.getDownloadURL();
}
function canvasToBlob(canvas, quality){
  return new Promise(resolve=>canvas.toBlob(resolve, 'image/jpeg', quality));
}
async function waitForPdfjs(timeoutMs){
  const start = Date.now();
  while(typeof window.pdfjsLib === 'undefined'){
    if(Date.now()-start > timeoutMs) return false;
    await new Promise(r=>setTimeout(r,100));
  }
  return true;
}
async function rasterizeAndUploadPdf(file, attId){
  const ok = await waitForPdfjs(4000);
  if(!ok) throw new Error('pdf.js 尚未載入完成，請檢查網路連線後重新整理頁面再試一次');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const maxPages = Math.min(pdf.numPages, 25);
  const pageUrls = [];
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.4});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport: viewport}).promise;
    const blob = await canvasToBlob(canvas, 0.82);
    const url = await uploadFileToStorage(`${STORAGE_FOLDER}/${attId}_p${i}.jpg`, blob);
    pageUrls.push(url);
  }
  return pageUrls;
}
async function processUploadedFile(file){
  const name = file.name;
  const lower = name.toLowerCase();
  const id = uid('att');
  const basePath = `${STORAGE_FOLDER}/${id}_${name}`;
  if(file.type.startsWith('image/')){
    const url = await uploadFileToStorage(basePath, file);
    return {id, type:'image', name, url};
  }
  if(lower.endsWith('.pdf') || file.type==='application/pdf'){
    const url = await uploadFileToStorage(basePath, file); // 原始檔備援下載
    let pageUrls = [];
    try{ pageUrls = await rasterizeAndUploadPdf(file, id); }
    catch(e){ console.error('pdf render failed', e); }
    return {id, type:'pdf', name, url, pageUrls, pageCount: pageUrls.length};
  }
  if(lower.endsWith('.docx')){
    const url = await uploadFileToStorage(basePath, file);
    let html = '';
    try{
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({arrayBuffer});
      html = result.value;
      if(html.length > 200000){ html = html.slice(0,200000) + '<p>（內容過長，已截斷，請下載原始檔查看完整內容）</p>'; }
    }catch(e){ console.error('mammoth convert failed', e); html = ''; }
    return {id, type:'docx', name, url, html};
  }
  if(lower.endsWith('.doc')){
    const url = await uploadFileToStorage(basePath, file);
    return {id, type:'doc', name, url, html:''};
  }
  throw new Error('unsupported file type: '+name);
}

window.__pdfPages = {};
function pdfSlideViewer(att){
  const pages = att.pageUrls || att.pages || []; // 新資料用 pageUrls（Storage 連結），舊資料相容 pages（base64）
  const viewerId = 'pdfv_'+att.id;
  if(!pages.length){
    return `<div class="pdf-viewer" id="${viewerId}">
      <p style="font-size:12px;color:var(--danger);margin-bottom:8px;">此 PDF 目前無法在頁面內預覽。</p>
      ${att.url ? `<a class="btn btn-ghost btn-block" style="margin-bottom:10px;" href="${att.url}" target="_blank" rel="noopener">📄 開啟原始 PDF：${att.name}</a>` : ''}
    </div>`;
  }
  window.__pdfPages[att.id] = pages;
  return `
    <div class="pdf-viewer" id="${viewerId}" data-att="${att.id}" data-page="0">
      <img class="modal-img" id="${viewerId}_img" src="${pages[0]}" alt="${att.name} 第1頁">
      <div class="pdf-nav">
        <button class="btn btn-ghost btn-sm" onclick="pdfNav('${att.id}','${viewerId}',-1)">‹ 上一頁</button>
        <span class="pdf-page-label" id="${viewerId}_label">1 / ${pages.length}</span>
        <button class="btn btn-ghost btn-sm" onclick="pdfNav('${att.id}','${viewerId}',1)">下一頁 ›</button>
      </div>
      <div class="modal-img-cap">${att.name}</div>
    </div>`;
}
function pdfNav(attId, viewerId, dir){
  const pages = window.__pdfPages[attId] || [];
  const container = document.getElementById(viewerId);
  if(!container || !pages.length) return;
  let page = parseInt(container.dataset.page||'0',10);
  page = Math.min(pages.length-1, Math.max(0, page+dir));
  container.dataset.page = page;
  document.getElementById(viewerId+'_img').src = pages[page];
  document.getElementById(viewerId+'_label').textContent = (page+1)+' / '+pages.length;
}
function renderViewerAttachments(attachments){
  if(!attachments || !attachments.length) return '';
  return attachments.map(a=>{
    const src = a.url || a.data; // 新資料用 url（Storage 連結），舊資料相容 data（base64）
    if(a.type==='image'){
      return `<img class="modal-img" src="${src}" alt="${a.name}"><div class="modal-img-cap">${a.name}</div>`;
    }
    if(a.type==='pdf'){
      return pdfSlideViewer(a);
    }
    if(a.type==='docx' || a.type==='doc'){
      const preview = a.html ? `<div style="border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;max-height:320px;overflow-y:auto;font-size:12.5px;line-height:1.6;margin-bottom:8px;background:var(--bg);">${a.html}</div>` : '<p style="font-size:12px;color:var(--ink-soft);">此檔案無法預覽，請下載查看。</p>';
      return `${preview}${src?`<a class="btn btn-ghost btn-block" style="margin-bottom:10px;" href="${src}" ${a.url?'target="_blank" rel="noopener"':`download="${a.name}"`}>📝 ${a.url?'開啟':'下載'}原始檔：${a.name}</a>`:''}`;
    }
    return '';
  }).join('');
}

let DB = null;
let firebaseConfigMissing = false;

async function loadDB(){
  const ok = initFirebase();
  if(!ok){
    firebaseConfigMissing = true;
    DB = buildDefaultData();
    return;
  }
  try{
    const doc = await firestoreDb.collection(FIRESTORE_DOC_PATH[0]).doc(FIRESTORE_DOC_PATH[1]).get();
    if(doc.exists){
      DB = doc.data();
      migrateDB();
      return;
    }
  }catch(e){ console.error('Firestore 讀取失敗', e); }
  DB = buildDefaultData();
  await persist();
}
function migrateDB(){
  if(!DB.employees) DB.employees = [];
  if(!DB.roster) DB.roster = [];
  if(!DB.codeMap) DB.codeMap = [];
  if(typeof DB.currentUserId === 'undefined') DB.currentUserId = null;
}
async function persist(){
  if(!firebaseReady){ firebaseConfigMissing = true; return; }
  try{
    await firestoreDb.collection(FIRESTORE_DOC_PATH[0]).doc(FIRESTORE_DOC_PATH[1]).set(DB);
  }catch(e){
    console.error('Firestore 寫入失敗', e);
    showToast('儲存失敗，請檢查網路連線或 Firebase 設定');
  }
}
async function resetDemoData(){
  DB = buildDefaultData();
  await persist();
  route('today');
  showToast('已重置為示範資料');
}

const S = { view:'today', stationId:null, adminTab:'stations', editingStation:null, editingItem:null, stationsTab:'weekday' };

function findStation(id){ return DB.stations.find(s=>s.id===id); }

/* =========================================================
   員編登入 / 學員自動配對邏輯
   ========================================================= */
function findEmployeeByEmpNo(empNo){ return DB.employees.find(e=>e.empNo===String(empNo).trim()); }
function findEmployeeByName(name){ return DB.employees.find(e=>e.name===String(name).trim()); }
function currentUser(){ return DB.currentUserId ? DB.employees.find(e=>e.id===DB.currentUserId) : null; }
function stripCodeSuffix(v){ return String(v||'').trim().split(/[\/#]/)[0].trim(); }
function getRosterCode(date, name){
  const entry = DB.roster.find(r=>r.date===date && r.name===name);
  return entry ? stripCodeSuffix(entry.code) : null;
}
function resolveStationForCode(code){
  if(!code) return null;
  const m = DB.codeMap.find(c=>c.code===code);
  return m ? findStation(m.stationId) : null;
}
function findMentorForCode(date, code, excludeName){
  const candidates = DB.roster.filter(r=>r.date===date && stripCodeSuffix(r.code)===code && r.name!==excludeName);
  for(const c of candidates){
    const emp = findEmployeeByName(c.name);
    if(emp && emp.role==='staff') return c.name;
  }
  return candidates.length ? candidates[0].name : null;
}
function computeAutoSchedule(employeeName, date){
  const code = getRosterCode(date, employeeName);
  if(!code) return null;
  const station = resolveStationForCode(code);
  if(!station) return null;
  const mentor = findMentorForCode(date, code, employeeName);
  if(!mentor) return null;
  return {station, mentor, code};
}
function findTraineesMentoredBy(staffName, date){
  const trainees = DB.employees.filter(e=>e.role==='trainee');
  const out = [];
  trainees.forEach(t=>{
    const auto = computeAutoSchedule(t.name, date);
    if(auto && auto.mentor===staffName) out.push({trainee:t, station:auto.station});
  });
  return out;
}

function progressKey(stationId){ return stationId+'_'+todayStr(); }
function getChecked(stationId){ return DB.progress[progressKey(stationId)] || []; }
function totalItems(station){ return station.categories.reduce((a,c)=>a+c.items.length,0); }
function checkedCount(station){ const arr=getChecked(station.id); return station.categories.reduce((a,c)=>a+c.items.filter(i=>arr.includes(i.id)).length,0); }
function percentDone(station){ const t=totalItems(station); if(!t) return 0; return Math.round(checkedCount(station)/t*100); }

async function toggleItem(stationId, itemId){
  const key = progressKey(stationId);
  const arr = DB.progress[key] ? DB.progress[key].slice() : [];
  const idx = arr.indexOf(itemId);
  if(idx>-1) arr.splice(idx,1); else arr.push(itemId);
  DB.progress[key] = arr;
  await persist();
  renderApp();
}

function blisterMini(pct){
  const total=8; const on=Math.round(pct/100*total);
  let caps='';
  for(let i=0;i<total;i++) caps += `<div class="cap ${i<on?'on':''}"></div>`;
  return `<div class="blister">${caps}</div>`;
}
function blisterRow(pct){
  const total=10; const on=Math.round(pct/100*total);
  let caps='';
  for(let i=0;i<total;i++) caps += `<div class="cap ${i<on?'on':''}"></div>`;
  return `<div class="blister-row">${caps}</div>`;
}

function renderTodayTrainee(user){

  let shiftCards = '';

    mentorBlock = `<div class="empty-note">根據今日班表自動比對，目前沒有需要您指導的學員。</div>`;
  }

  const otherBlock = manualToday.length ? manualToday.map(sc=>{
    const st = findStation(sc.stationId); if(!st) return '';
    return buildShiftCard(st, sc.shift, sc.mentor, sc.trainee, false);
  }).join('') : '';

  return `
  <div class="view">
    <div class="greeting">早安，${user.name}！</div>
    <div class="greeting-sub">今天是 ${t}（${weekdayZh(t)}），以下是根據班表自動比對的教學配對。</div>
    <div class="section-label"><span>🧑‍🏫 教學配對</span><div class="dash"></div></div>
    ${mentorBlock}
    ${otherBlock ? `<div class="section-label"><span>📋 其他手動班表</span><div class="dash"></div></div>${otherBlock}` : ''}
  </div>`;
}

function renderTodayGeneric(){
  const t = todayStr(), tmr = tomorrowStr();
  const todaySched = DB.schedule.filter(s=>s.date===t);
  const tmrSched = DB.schedule.filter(s=>s.date===tmr);

  let shiftCards = '';
  if(todaySched.length===0){
    shiftCards = `<div class="empty-note">今天尚無班表資料。請至「後台管理 → 班表管理」新增或匯入班表。</div>`;
  }else{
    shiftCards = todaySched.map(sc=>{
      const st = findStation(sc.stationId);
      if(!st) return '';
      return buildShiftCard(st, sc.shift, sc.mentor, sc.trainee, false);
    }).join('');
  }

  let preview = '';
  if(tmrSched.length){
    preview = tmrSched.map(sc=>{
      const st = findStation(sc.stationId);
      if(!st) return '';
      return `
      <div class="preview-card" style="margin-bottom:10px;">
        <h4>${st.emoji} ${st.name}（${sc.shift}）${sc.trainee?` · ${sc.trainee}`:''}</h4>
        <p>明日指導藥師：${sc.mentor}，請提前預習站別教學重點。</p>
        <button class="btn btn-outline btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.5);" onclick="openStation('${st.id}')">預習教學指引</button>
      </div>`;
    }).join('');
  }else{
    preview = `<div class="empty-note">尚無明日班表資料。</div>`;
  }

  return `
  <div class="view">
    <div class="greeting">早安，${DB.user.name}！</div>
    <div class="greeting-sub">今天是 ${t}（${weekdayZh(t)}），以下是您的班表與指導藥師資訊。</div>

    <div class="section-label"><span>📅 今日學習站別</span><div class="dash"></div></div>
    ${shiftCards}

    <div class="section-label"><span>🔭 明日預告</span><div class="dash"></div></div>
    ${preview}
  </div>`;
}

/* =========================================================
   STATION DETAIL VIEW
   ========================================================= */
function renderStationDetail(){
  const st = findStation(S.stationId);
  if(!st){ S.view='stations'; return renderStationList(); }
  const c = STATION_COLORS.find(c=>c.id===st.color) || STATION_COLORS[0];
  const checked = getChecked(st.id);
  const pct = percentDone(st);
  const todaySched = DB.schedule.find(s=>s.date===todayStr() && s.stationId===st.id);
  const mentorName = todaySched ? todaySched.mentor : '尚未安排';
  const shiftLabel = todaySched ? todaySched.shift : '無班表';

  const stationOptions = ['weekday','sat','sun'].map(dt=>{
    const opts = DB.stations.filter(s=>(s.dayType||'weekday')===dt).map(s=>`<option value="${s.id}" ${s.id===st.id?'selected':''}>${s.emoji} ${s.name}（${s.code}）</option>`).join('');
    return opts ? `<optgroup label="${DAYTYPE_LABEL[dt]}">${opts}</optgroup>` : '';
  }).join('');

  const tpCards = st.teachingPoints.map(tp=>`
    <div class="tp-card" style="border-left-color:${c.hex}">
      <h5>${tp.title}</h5>
      <button class="btn btn-ghost btn-sm" onclick="openImageModal('${tp.id}','${st.id}')">🔎 檢視圖解說明</button>
    </div>`).join('');

  const catBlocks = st.categories.map((cat,ci)=>{
    const items = cat.items.map(item=>{
      const isChecked = checked.includes(item.id);
      const hasDetail = !!item.detail;
      const previewSections = hasDetail ? migrateDetailToSections(item.detail) : [];
      return `
      <div class="check-row ${isChecked?'checked':''} ${item.important?'important':''}">
        <input type="checkbox" ${isChecked?'checked':''} onclick="event.stopPropagation();toggleItem('${st.id}','${item.id}')">
        <div class="txt" onclick="${hasDetail?`openItemModal('${st.id}','${item.id}')`:`toggleItem('${st.id}','${item.id}')`}">
          <div class="line">${item.text}${hasDetail?'<span class="info-dot">i</span>':''}</div>
          ${item.important && previewSections.length && previewSections[0].title ? `<div class="note">* 最重要！${previewSections[0].title}</div>` : (item.important ? `<div class="note">* 最重要項目</div>`:'')}
        </div>
      </div>`;
    }).join('');
    return `
    <div class="cat-block">
      <div class="cat-title"><span class="cat-num">${ci+1}</span>${cat.title}</div>
      ${items}
    </div>`;
  }).join('');

  return `
  <div class="view">
    <div class="back-row">
      <button class="back-btn" onclick="route('stations')">← 回總覽</button>
      <select class="station-select" onchange="openStation(this.value)">${stationOptions}</select>
    </div>

    <div class="station-header" style="background:linear-gradient(135deg, ${c.hex}, ${c.hex}CC);">
      <span class="shift-badge">${shiftLabel}</span>
      <h3>${st.emoji} ${st.name}（${st.code}）· 當下教學指引</h3>
      <div class="mentor-line">指導老師：<b>${mentorName}</b></div>
      ${blisterRow(pct)}
      <div class="progress-label"><span>教學完成度</span><span>${pct}%（${checkedCount(st)}/${totalItems(st)}）</span></div>
    </div>

    <div class="block-title">📖 務必教學重點</div>
    ${tpCards || '<p style="font-size:12.5px;color:var(--ink-soft);">尚未設定教學重點，請至後台新增。</p>'}

    <div class="block-title" style="margin-top:22px;">📋 工作檢核表</div>
    <div class="hint-banner">💡 請老師確認學生了解後再勾選；項目文字旁有「i」標記者，點擊文字可查看教學小視窗。</div>
    ${catBlocks || '<p style="font-size:12.5px;color:var(--ink-soft);">尚未設定檢核表，請至後台新增。</p>'}

    <div class="reset-row"><button onclick="resetStationProgress('${st.id}')">重新開始本站今日檢核（僅重置勾選）</button></div>
  </div>`;
}

function openItemModal(stationId, itemId){

}

async function addTeachingPoint(stId){
  const st = findStation(stId);
  st.teachingPoints.push({id:uid('tp'), title:'新教學重點', bullets:['說明重點一'], image:''});

async function deleteTeachingPoint(stId, tpId){
  const st = findStation(stId);
  st.teachingPoints = st.teachingPoints.filter(t=>t.id!==tpId);
  await persist(); renderApp();
}
function editTeachingPoint(stId, tpId){
  const st = findStation(stId);
  const tp = st.teachingPoints.find(t=>t.id===tpId);
  openModal(`
    <div class="modal-top"><h4>編輯教學重點</h4><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-group"><label>標題</label><input type="text" id="edit-tp-title" value="${tp.title}"></div>
    <div class="form-group"><label>重點內容（每行一項）</label><textarea id="edit-tp-bullets">${tp.bullets.join('\n')}</textarea></div>
    <div class="form-group"><label>圖片網址（選填，也可用下方上傳檔案）</label><input type="text" id="edit-tp-image" value="${tp.image||''}"></div>
    <div class="subhead" style="margin-top:14px;">教材附件（圖片／PDF／Word）</div>
    ${renderAdminAttachmentChips(tp.attachments, `removeTpAttachment('${stId}','${tpId}',`)}
    <input type="file" id="tp-att-input" accept="image/*,.pdf,.doc,.docx" multiple style="width:100%;margin-bottom:6px;">
    <p style="font-size:11px;color:var(--ink-soft);margin:0 0 8px;">單檔建議 3.5MB 以內；Word（.docx）會自動轉換為可預覽內容。</p>
    <button class="btn btn-ghost btn-block" style="margin-bottom:14px;" onclick="uploadTpAttachments('${stId}','${tpId}')">上傳選取的檔案</button>
    <button class="btn btn-primary btn-block" onclick="saveTeachingPoint('${stId}','${tpId}')">儲存</button>
  `);
}
function captureTpModalFields(){
  return {
    title: document.getElementById('edit-tp-title').value.trim(),
    bullets: document.getElementById('edit-tp-bullets').value.split('\n').map(s=>s.trim()).filter(Boolean),
    image: document.getElementById('edit-tp-image').value.trim(),
  };
}
async function saveTeachingPoint(stId, tpId){
  const st = findStation(stId);
  const tp = st.teachingPoints.find(t=>t.id===tpId);
  const f = captureTpModalFields();
  tp.title = f.title || tp.title;
  tp.bullets = f.bullets;
  tp.image = f.image;
  await persist(); closeModal(); showToast('已儲存教學重點');
}
async function uploadTpAttachments(stId, tpId){
  const input = document.getElementById('tp-att-input');
  const files = Array.from((input && input.files) || []);
  if(!files.length){ showToast('請先選擇檔案'); return; }
  const st = findStation(stId);
  const tp = st.teachingPoints.find(t=>t.id===tpId);
  const f = captureTpModalFields();
  tp.title = f.title || tp.title; tp.bullets = f.bullets; tp.image = f.image;
  const newAtts = [];
  for(const file of files){
    if(file.size > MAX_ATTACHMENT_BYTES){ showToast(`${file.name} 超過 ${humanFileSize(MAX_ATTACHMENT_BYTES)}，已略過`); continue; }
    try{ newAtts.push(await processUploadedFile(file)); }
    catch(e){ console.error(e); showToast(`${file.name} 無法處理，已略過`); }
  }
  tp.attachments = (tp.attachments||[]).concat(newAtts);
  await persist();
  editTeachingPoint(stId, tpId);
  showToast(`已上傳 ${newAtts.length} 個檔案`);
}
async function removeTpAttachment(stId, tpId, attId){
  const st = findStation(stId);
  const tp = st.teachingPoints.find(t=>t.id===tpId);
  const f = captureTpModalFields();
  tp.title = f.title || tp.title; tp.bullets = f.bullets; tp.image = f.image;
  tp.attachments = (tp.attachments||[]).filter(a=>a.id!==attId);
  await persist();
  editTeachingPoint(stId, tpId);
}

  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  cat.items = cat.items.filter(i=>i.id!==itemId);
  await persist(); renderApp();
}
function migrateDetailToSections(d){
  if(!d) return [];
  if(d.sections && d.sections.length) return d.sections.map(s=>({title:s.title||'', text:s.text||''}));
  const legacyText = (d.steps||[]).join('\n');
  if(d.summary || legacyText) return [{title:d.summary||'', text:legacyText}];
  return [];
}
function renderItemSectionsEditor(sections, stId, catId, itemId){
  if(!sections.length) return '<p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 8px;">尚未新增任何提醒事項。</p>';
  return sections.map((s,i)=>`
    <div class="card" style="padding:12px;margin-bottom:8px;background:var(--bg);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <b style="font-size:12px;color:var(--ink-soft);">提醒事項 ${i+1}</b>
        <button type="button" class="mini-x" onclick="removeItemSectionAt('${stId}','${catId}','${itemId}',${i})">✕ 刪除</button>
      </div>
      <div class="form-group" style="margin-bottom:6px;"><label>標題（紅字顯示）</label><input type="text" class="section-title-input" data-idx="${i}" value="${s.title||''}"></div>
      <div class="form-group" style="margin-bottom:0;"><label>說明內容</label><textarea class="section-text-input" data-idx="${i}">${s.text||''}</textarea></div>
    </div>`).join('');
}
function readSectionsFromModal(){
  const titles = Array.from(document.querySelectorAll('.section-title-input'));
  const texts = Array.from(document.querySelectorAll('.section-text-input'));
  return titles.map((t,i)=>({title:t.value.trim(), text:(texts[i]?texts[i].value.trim():'')})).filter(s=>s.title || s.text);
}

let editingItemSections = [];

function editItem(stId, catId, itemId, sectionsOverride){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  const d = item.detail || {image:'', attachments:[]};
  editingItemSections = sectionsOverride || migrateDetailToSections(item.detail);
  openModal(`
    <div class="modal-top"><h4>編輯檢核項目</h4><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-group"><label>項目文字</label><input type="text" id="edit-item-text" value="${item.text}"></div>
    <div class="chk-inline"><input type="checkbox" id="edit-item-important" ${item.important?'checked':''}><label for="edit-item-important" style="margin:0;font-weight:400;">標記為最重要項目</label></div>
    <div class="chk-inline"><input type="checkbox" id="edit-item-hasdetail" ${item.detail?'checked':''} onchange="document.getElementById('detail-fields').style.display=this.checked?'block':'none'"><label for="edit-item-hasdetail" style="margin:0;font-weight:400;">此項目有特殊教學內容（點文字彈出小視窗）</label></div>
    <div id="detail-fields" style="display:${item.detail?'block':'none'};border-top:1px dashed var(--line);padding-top:10px;">
      <div class="subhead" style="margin-top:0;">提醒事項</div>
      <div id="item-sections-container">${renderItemSectionsEditor(editingItemSections, stId, catId, itemId)}</div>
      <button type="button" class="btn btn-outline btn-block" style="margin-bottom:14px;" onclick="addItemSection('${stId}','${catId}','${itemId}')">＋ 新增提醒事項</button>
      <div class="form-group"><label>圖片網址（選填，也可用下方上傳檔案）</label><input type="text" id="edit-item-image" value="${d.image||''}"></div>
      <div class="subhead" style="margin-top:6px;">教材附件（圖片／PDF／Word）</div>
      ${renderAdminAttachmentChips(d.attachments, `removeItemAttachment('${stId}','${catId}','${itemId}',`)}
      <input type="file" id="item-att-input" accept="image/*,.pdf,.doc,.docx" multiple style="width:100%;margin-bottom:6px;">
      <p style="font-size:11px;color:var(--ink-soft);margin:0 0 8px;">單檔建議 3.5MB 以內；Word（.docx）會自動轉換為可預覽內容。</p>
      <button type="button" class="btn btn-ghost btn-block" style="margin-bottom:6px;" onclick="uploadItemAttachments('${stId}','${catId}','${itemId}')">上傳選取的檔案</button>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="saveItem('${stId}','${catId}','${itemId}')">儲存</button>
  `);
}
function addItemSection(stId, catId, itemId){
  const current = readSectionsFromModal();
  current.push({title:'', text:''});
  editItem(stId, catId, itemId, current);
}
function removeItemSectionAt(stId, catId, itemId, idx){
  const current = readSectionsFromModal();
  current.splice(idx,1);
  editItem(stId, catId, itemId, current);
}
function captureItemModalFields(){
  return {
    text: document.getElementById('edit-item-text').value.trim(),
    important: document.getElementById('edit-item-important').checked,
    hasDetail: document.getElementById('edit-item-hasdetail').checked,
    sections: readSectionsFromModal(),
    image: document.getElementById('edit-item-image') ? document.getElementById('edit-item-image').value.trim() : '',
  };
}
async function saveItem(stId, catId, itemId){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  const f = captureItemModalFields();
  item.text = f.text || item.text;
  item.important = f.important;
  if(f.hasDetail){
    const prevAttachments = (item.detail && item.detail.attachments) || [];
    item.detail = { sections:f.sections, image:f.image, attachments:prevAttachments };
  }else{
    item.detail = null;
  }
  await persist(); closeModal(); showToast('已儲存檢核項目');
}
async function uploadItemAttachments(stId, catId, itemId){
  const input = document.getElementById('item-att-input');
  const files = Array.from((input && input.files) || []);
  if(!files.length){ showToast('請先選擇檔案'); return; }
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  const f = captureItemModalFields();
  const prevAttachments = (item.detail && item.detail.attachments) || [];
  item.text = f.text || item.text;
  item.important = f.important;
  item.detail = { sections:f.sections, image:f.image, attachments:prevAttachments };
  const newAtts = [];
  for(const file of files){
    if(file.size > MAX_ATTACHMENT_BYTES){ showToast(`${file.name} 超過 ${humanFileSize(MAX_ATTACHMENT_BYTES)}，已略過`); continue; }
    try{ newAtts.push(await processUploadedFile(file)); }
    catch(e){ console.error(e); showToast(`${file.name} 無法處理，已略過`); }
  }
  item.detail.attachments = prevAttachments.concat(newAtts);
  await persist();
  editItem(stId, catId, itemId, f.sections);
  showToast(`已上傳 ${newAtts.length} 個檔案`);
}
async function removeItemAttachment(stId, catId, itemId, attId){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  const f = captureItemModalFields();
  item.text = f.text || item.text;
  item.important = f.important;
  const prevAttachments = ((item.detail && item.detail.attachments) || []).filter(a=>a.id!==attId);
  item.detail = { sections:f.sections, image:f.image, attachments:prevAttachments };
  await persist();
  editItem(stId, catId, itemId, f.sections);
}

async function addEmployee(){
  const empNo = document.getElementById('new-emp-no').value.trim();
  const name = document.getElementById('new-emp-name').value.trim();
  const role = document.getElementById('new-emp-role').value;
  if(!empNo || !name){ showToast('請填寫員編與姓名'); return; }
  if(findEmployeeByEmpNo(empNo)){ showToast('此員編已存在'); return; }
  DB.employees.push({id:uid('emp'), empNo, name, role});
  await persist(); renderApp(); showToast('已新增人員');
}
async function updateEmployeeRole(id, role){
  const e = DB.employees.find(x=>x.id===id);
  if(!e) return;
  e.role = role;
  await persist(); renderApp();
}
async function deleteEmployee(id){
  DB.employees = DB.employees.filter(e=>e.id!==id);
  if(DB.currentUserId===id) DB.currentUserId=null;
  await persist(); renderApp();
}
async function addCodeMap(){
  const code = document.getElementById('new-code-text').value.trim();
  const stationId = document.getElementById('new-code-station').value;
  if(!code){ showToast('請輸入班表代碼'); return; }
  DB.codeMap.push({id:uid('cm'), code, stationId});
  await persist(); renderApp(); showToast('已新增對照');
}
async function deleteCodeMap(id){
  DB.codeMap = DB.codeMap.filter(c=>c.id!==id);
  await persist(); renderApp();
}

let loginError = '';
function renderLogin(){
  return `
    <div class="view" style="padding-top:50px;">
      <div class="rx-mark" style="width:52px;height:52px;font-size:26px;margin:0 auto 28px;">℞</div>
      <div style="max-width:340px;margin:0 auto;">
        <label class="login-field-label">員工編號</label>
        <div class="login-id-row">
          <span class="login-y-badge">Y</span>
          <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="5" id="login-empno" class="login-id-input" placeholder="00000" oninput="onLoginIdInput()" onkeydown="if(event.key==='Enter')doLogin()" autofocus>
        </div>

        <label class="login-field-label" style="margin-top:16px;">員工姓名（自動帶入）</label>
        <div class="login-name-box" id="login-name-preview">輸入員編後自動顯示</div>

        ${loginError ? `<p style="color:var(--danger);font-size:12px;margin:10px 0 0;">${loginError}</p>` : ''}
        <button class="btn btn-primary btn-block" style="margin-top:20px;min-height:52px;font-size:15px;" onclick="doLogin()">登入系統</button>
      </div>
    </div>`;
}
function lookupByDigits(digits){
  if(!digits) return null;
  const padded = digits.padStart(5,'0');
  return findEmployeeByEmpNo('Y'+padded) || null;
}
function onLoginIdInput(){
  const input = document.getElementById('login-empno');
  input.value = input.value.replace(/[^0-9]/g,'').slice(0,5);
  const box = document.getElementById('login-name-preview');
  const digits = input.value;
  if(!digits){
    box.textContent = '輸入員編後自動顯示';
    box.classList.remove('resolved','notfound');
    return;
  }
  const emp = lookupByDigits(digits);
  if(emp){
    box.textContent = emp.name;
    box.classList.add('resolved');
    box.classList.remove('notfound');
  }else{
    box.textContent = digits.length===5 ? '查無此員編' : '輸入員編後自動顯示';
    box.classList.remove('resolved');
    box.classList.toggle('notfound', digits.length===5);
  }
}
async function doLogin(){
  const raw = (document.getElementById('login-empno').value||'').trim();
  const digits = raw.replace(/[^0-9]/g,'');
  if(!digits){ loginError='請輸入員編數字'; renderApp(); return; }
  const padded = digits.padStart(5,'0');
  const candidate = 'Y'+padded;
  let emp = findEmployeeByEmpNo(candidate) || findEmployeeByEmpNo(raw) || findEmployeeByEmpNo(digits);
  if(!emp){ loginError='查無此員編，請確認後再試一次'; renderApp(); return; }
  loginError='';
  DB.currentUserId = emp.id;
  S.view = 'today';
  await persist();
  renderApp();
}
async function doLogout(){
  DB.currentUserId = null;
  await persist();
  renderApp();
}

/* =========================================================
   INIT
   ========================================================= */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label} 逾時（超過 ${ms/1000} 秒無回應）`)), ms))
  ]);
}
function showFatalError(title, detail){
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px;margin:40px auto;padding:20px;font-family:sans-serif;">
      <div style="background:#FBE4DF;border:1px solid #C0432F;border-radius:12px;padding:18px 20px;color:#7A241A;">
        <b style="font-size:15px;">⚠ ${title}</b>
        <p style="font-size:13px;line-height:1.6;margin:10px 0 0;white-space:pre-wrap;">${detail}</p>
        <p style="font-size:11.5px;margin:14px 0 0;color:#8A3A2C;">提示：如果是用滑鼠雙擊直接開啟這個檔案（網址列開頭是 file:///），請改成部署到網站上（例如 GitHub Pages）後用 https:// 網址開啟再試一次。</p>
      </div>
    </div>`;
}

(async function init(){
  document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#5B6B65;font-family:sans-serif;">載入中...</div>';
  try{
    if(typeof firebase === 'undefined'){
      showFatalError('Firebase 程式庫載入失敗', 'firebase-app-compat.js 等外部程式庫沒有成功載入，可能是網路連線問題，或瀏覽器/防火牆擋住了 gstatic.com。請檢查網路連線後重新整理頁面。');
      return;
    }
    try{ initScheduleFirebase(); }catch(e){ console.error('班表系統連線初始化失敗（不影響主要功能）', e); }
    await withTimeout(loadDB(), 12000, '資料庫連線');
    const dow = new Date().getDay();
    S.stationsTab = dow===6 ? 'sat' : (dow===0 ? 'sun' : 'weekday');
    renderApp();
  }catch(e){
    console.error('App 初始化失敗', e);
    showFatalError('載入失敗', '錯誤訊息：' + (e && e.message ? e.message : String(e)));
  }
})();
</script>
