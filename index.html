<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>站別教學指引 · On-the-spot Teaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F1;
  --paper:#FFFFFF;
  --ink:#1C2B26;
  --ink-soft:#5B6B65;
  --line:#E1E7E2;
  --primary:#12655C;
  --primary-dk:#0A423C;
  --primary-tint:#DCEFEA;
  --amber:#DD7A2A;
  --amber-tint:#FBE9D6;
  --danger:#C0432F;
  --danger-tint:#FBE4DF;
  --mint:#CFEEE1; --mint-ink:#0E5E4C;
  --sky:#D3E5F4; --sky-ink:#1B4E78;
  --lav:#E3DBF3; --lav-ink:#4E3B84;
  --peach:#F5DFCF; --peach-ink:#8B4A20;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow:0 2px 10px rgba(18,101,92,0.08), 0 1px 2px rgba(18,101,92,0.06);
  --font-display:'Noto Serif TC', serif;
  --font-body:'Noto Sans TC', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  padding-bottom:78px;
  box-shadow:0 0 40px rgba(0,0,0,0.06);
  overflow-x:hidden;
}
@media(min-width:540px){
  .shell{margin-top:18px; margin-bottom:18px; min-height:calc(100vh - 36px); border-radius:28px; overflow:hidden;}
}
/* ---- top bar ---- */
.topbar{
  background:var(--primary-dk);
  color:#fff;
  padding:16px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.rx-mark{
  width:34px;height:34px;border-radius:10px;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:18px;color:#2A1706;
  flex-shrink:0;
}
.brand h1{font-family:var(--font-display);font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;}
.brand p{margin:0;font-size:10.5px;color:#B9D6CF;letter-spacing:.08em;text-transform:uppercase;}
.topbar .date-chip{
  font-family:var(--font-mono);font-size:11px;color:#CFE7E1;
  background:rgba(255,255,255,0.08);
  padding:5px 9px;border-radius:100px;
  white-space:nowrap;
}
/* ---- bottom nav ---- */
.bottomnav{
  position:fixed;
  bottom:0;left:0;right:0;
  max-width:480px;
  margin:0 auto;
  background:var(--paper);
  border-top:1px solid var(--line);
  display:flex;
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.shell .bottomnav{position:sticky;}
.bottomnav button{
  flex:1;
  background:none;border:none;
  padding:10px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--font-body);font-size:11px;color:var(--ink-soft);
  cursor:pointer;
}
.bottomnav button .ic{font-size:19px;line-height:1;}
.bottomnav button.active{color:var(--primary);}
.bottomnav button.active .ic{transform:translateY(-1px);}

/* ---- generic ---- */
.view{padding:16px 16px 8px;}
h2.page-title{font-family:var(--font-display);font-size:21px;margin:2px 0 3px;color:var(--primary-dk);}
p.page-sub{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}
.card{background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-body);font-weight:700;font-size:13.5px;
  padding:11px 16px;border-radius:100px;border:none;cursor:pointer;
  min-height:44px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dk);}
.btn-ghost{background:var(--primary-tint);color:var(--primary-dk);}
.btn-outline{background:#fff;color:var(--primary-dk);border:1.5px solid var(--primary);}
.btn-amber{background:var(--amber);color:#2A1706;}
.btn-danger{background:var(--danger-tint);color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12px;min-height:34px;}
.pill-tag{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.tag-mint{background:var(--mint);color:var(--mint-ink);}
.tag-sky{background:var(--sky);color:var(--sky-ink);}
.tag-lav{background:var(--lav);color:var(--lav-ink);}
.tag-peach{background:var(--peach);color:var(--peach-ink);}

/* ---- today view ---- */
.greeting{font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--primary-dk);margin:4px 0 2px;}
.greeting-sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
.section-label{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);font-weight:700;font-size:14px;
  color:var(--primary-dk);margin:22px 0 10px;
}
.section-label .dash{flex:1;height:1px;background:var(--line);}
.shift-card{
  background:var(--paper);border-radius:var(--radius-lg);
  border:1px solid var(--line);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:12px;
}
.shift-card .shift-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);
  border-bottom:1px dashed var(--line);
}
.shift-card .shift-body{padding:14px 16px 16px;}
.station-name{font-family:var(--font-display);font-size:17px;font-weight:700;margin:2px 0 10px;color:var(--ink);}
.mentor-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.badge-avatar{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;
  flex-shrink:0;
  background:var(--primary);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12);
}
.mentor-meta p{margin:0;line-height:1.35;}
.mentor-meta .role{font-size:10.5px;color:var(--ink-soft);letter-spacing:.03em;}
.mentor-meta .name{font-size:14px;font-weight:700;}
.progress-mini{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}
.blister{display:flex;gap:3px;}
.blister .cap{width:9px;height:15px;border-radius:5px;background:var(--line);}
.blister .cap.on{background:var(--primary);}
.preview-card{
  background:linear-gradient(135deg,var(--primary-dk),var(--primary));
  color:#fff;border-radius:var(--radius-lg);padding:14px 16px;margin-top:6px;
}
.preview-card h4{margin:2px 0 6px;font-family:var(--font-display);font-size:14px;}
.preview-card p{margin:0 0 10px;font-size:12px;color:#C9E4DD;line-height:1.5;}
.empty-note{
  background:var(--amber-tint);color:#7A3F0C;border-radius:var(--radius-md);
  padding:12px 14px;font-size:12.5px;line-height:1.5;
}

/* ---- station list ---- */
.station-list-card{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;
}
.station-emoji{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.station-list-card .info{flex:1;min-width:0;}
.station-list-card .info .top-row{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.station-list-card .info .name{font-family:var(--font-display);font-weight:700;font-size:15px;}
.station-list-card .info .meta{font-size:11.5px;color:var(--ink-soft);}
.chev{color:var(--ink-soft);font-size:18px;}

/* ---- station detail ---- */
.back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.back-btn{background:none;border:none;color:var(--primary-dk);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;padding:6px 0;}
.station-select{font-family:var(--font-body);font-size:12px;border:1px solid var(--line);border-radius:100px;padding:6px 10px;background:#fff;color:var(--ink);}
.station-header{
  border-radius:var(--radius-lg);padding:16px 18px 18px;color:#fff;position:relative;overflow:hidden;
  margin-bottom:16px;
}
.station-header .shift-badge{
  display:inline-block;background:rgba(255,255,255,0.22);padding:3px 10px;border-radius:100px;font-size:10.5px;font-weight:700;letter-spacing:.03em;margin-bottom:8px;
}
.station-header h3{font-family:var(--font-display);font-size:20px;margin:0 0 2px;}
.station-header .mentor-line{font-size:12px;color:rgba(255,255,255,0.85);margin-bottom:14px;}
.station-header .mentor-line b{color:#fff;}
.blister-row{display:flex;gap:4px;margin-bottom:6px;}
.blister-row .cap{flex:1;height:16px;border-radius:6px;background:rgba(255,255,255,0.25);}
.blister-row .cap.on{background:#fff;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;font-family:var(--font-mono);color:rgba(255,255,255,0.9);}

.block-title{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--primary-dk);margin:0 0 10px;}
.hint-banner{
  background:var(--amber-tint);color:#7A3F0C;font-size:11.5px;padding:8px 12px;border-radius:var(--radius-sm);
  margin-bottom:12px;display:flex;gap:6px;align-items:flex-start;line-height:1.4;
}
.tp-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:13px 14px;margin-bottom:10px;
  border-left:4px solid var(--primary);
}
.tp-card h5{margin:0 0 6px;font-size:13.5px;font-weight:700;}
.tp-card ul{margin:0 0 10px;padding-left:18px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.tp-card ul li::marker{color:var(--primary);}

.cat-block{margin-bottom:16px;}
.cat-title{
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:8px;
}
.cat-num{
  width:20px;height:20px;border-radius:6px;background:var(--primary-tint);color:var(--primary-dk);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
}
.check-row{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:11px 12px;margin-bottom:8px;
}
.check-row.important{border-color:#EBC3B7;background:#FEFAF8;}
.check-row input[type=checkbox],.check-row input[type=radio]{
  width:20px;height:20px;margin-top:1px;accent-color:var(--primary);flex-shrink:0;cursor:pointer;
}
.quiz-score-big{font-family:var(--font-display);font-size:28px;font-weight:700;color:#fff;margin:0 0 2px;}
.check-row .txt{flex:1;cursor:pointer;}
.check-row .txt .line{font-size:13px;line-height:1.45;white-space:pre-line;}
.check-row.checked{background:var(--mint);border-color:var(--primary);}
.check-row.checked .line{color:var(--primary-dk);font-weight:600;}
.check-row.checked .line::before{content:'✓ ';color:var(--primary);font-weight:700;}
.check-row.locked{opacity:0.75;}
.check-row.locked input[type=checkbox]{cursor:not-allowed;}
.check-row .note{font-size:11px;color:var(--danger);margin-top:3px;font-weight:700;}
.info-dot{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dk);
  font-size:10px;font-weight:700;margin-left:5px;vertical-align:middle;
}
.reset-row{text-align:center;margin-top:6px;margin-bottom:20px;}
.reset-row button{background:none;border:none;color:var(--ink-soft);font-size:11.5px;text-decoration:underline;cursor:pointer;}

/* ---- modal ---- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,25,22,0.55);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;
  padding:0;
}
@media(min-width:540px){.modal-overlay{align-items:center;}}
.modal-box{
  background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;padding:20px 20px 26px;
  animation:slideup .18s ease-out;
}
@media(min-width:540px){.modal-box{border-radius:20px;}}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-box .modal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.modal-box h4{font-family:var(--font-display);font-size:17px;margin:0;padding-right:10px;line-height:1.4;}
.modal-close{background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;color:var(--ink-soft);}
.modal-summary{background:var(--danger-tint);color:var(--danger);padding:9px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;margin-bottom:12px;}
.modal-steps{margin:0 0 14px;padding-left:20px;font-size:13px;line-height:1.75;color:var(--ink);}
.docx-preview table{border-collapse:collapse;width:100%;margin:8px 0;}
.docx-preview table td,.docx-preview table th{border:1px solid var(--line);padding:5px 7px;font-size:12px;}
.docx-preview table th{background:var(--primary-tint);font-weight:700;}
.docx-preview p{margin:0 0 8px;}
.docx-preview img{max-width:100%;}
.modal-img{width:100%;border-radius:var(--radius-md);margin-bottom:6px;display:block;background:var(--bg);}
.modal-img-cap{font-size:11px;color:var(--ink-soft);text-align:center;margin-bottom:10px;}
.pdf-viewer{margin-bottom:10px;}
.pdf-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 6px;}
.pdf-page-label{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}

/* ---- admin ---- */
.admin-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:4px;}
.admin-tabs button{
  flex:1;border:none;background:none;padding:8px 4px;border-radius:100px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;
}
.admin-tabs button.active{background:var(--primary);color:#fff;}
.admin-tabs.admin-tabs-3{flex-wrap:wrap;border-radius:22px;}
.admin-tabs.admin-tabs-3 button{flex:1 1 calc(33.333% - 6px);}
.pp-subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.pp-subtabs button{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.pp-subtabs button.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.admin-station-row{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:12px;margin-bottom:10px;
}
.admin-station-row .info{flex:1;}
.admin-station-row .name{font-weight:700;font-size:13.5px;}
.admin-station-row .meta{font-size:11px;color:var(--ink-soft);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.form-group input[type=text],.form-group input[type=date],.form-group select,.form-group textarea{
  width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:var(--font-body);background:#fff;color:var(--ink);
}
.form-group textarea{min-height:70px;resize:vertical;}
.color-picker{display:flex;gap:8px;}
.color-swatch{width:32px;height:32px;border-radius:9px;cursor:pointer;border:2px solid transparent;}
.color-swatch.sel{border-color:var(--ink);}
.chk-inline{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:10px;}
.chk-inline input{width:17px;height:17px;accent-color:var(--primary);}
.admin-item-row{
  display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--radius-sm);padding:9px 10px;margin-bottom:6px;
}
.admin-item-row .t{flex:1;font-size:12.5px;}
.admin-item-row .badges{display:flex;gap:4px;}
.mini-x{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:2px 4px;}
.mini-edit{background:none;border:none;color:var(--primary);cursor:pointer;font-size:12px;padding:2px 4px;font-weight:700;}
.subhead{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
table.sched-table{width:100%;border-collapse:collapse;font-size:12px;}
table.sched-table th{text-align:left;color:var(--ink-soft);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap;}
table.sched-table td{padding:8px 4px;border-bottom:1px solid var(--line);}
table.sched-table td:first-child,table.sched-table th:first-child{white-space:nowrap;font-family:var(--font-mono);font-size:11px;}
table.sched-table td:nth-child(2),table.sched-table th:nth-child(2){white-space:nowrap;}
table.sched-table td:nth-child(4),table.sched-table th:nth-child(4){white-space:nowrap;}
.csv-box{
  border:1.5px dashed var(--line);border-radius:var(--radius-md);padding:14px;text-align:center;background:var(--bg);margin-bottom:12px;
}
.csv-example{
  background:var(--ink);color:#CFE7E1;font-family:var(--font-mono);font-size:11px;border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0;overflow-x:auto;white-space:pre;
}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:100px;font-size:12.5px;z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
}
.otp-row{
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:text;position:relative;
}
.otp-prefix{
  font-family:var(--font-display);font-weight:700;font-size:32px;color:var(--primary-dk);
}
.otp-boxes{position:relative;display:flex;gap:8px;}
.otp-box{
  width:44px;height:56px;border:2px solid var(--line);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--ink);
  background:#fff;
}
.otp-box.filled{border-color:var(--primary);background:var(--primary-tint);}
.otp-hidden-input{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;
}
.login-field-label{
  display:block;font-size:13px;font-weight:700;color:var(--primary-dk);margin-bottom:7px;
}
.login-id-row{
  display:flex;align-items:stretch;gap:10px;min-width:0;
}
.login-y-badge{
  width:56px;flex-shrink:0;border-radius:var(--radius-md);background:var(--primary-tint);color:var(--primary-dk);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:20px;
}
.login-id-input{
  flex:1 1 0%;min-width:0;width:100%;border:2px solid var(--primary);border-radius:var(--radius-md);
  font-family:var(--font-mono);font-size:26px;letter-spacing:.12em;text-align:left;color:var(--ink);
  background:#fff;padding:0 14px;
}
.login-id-input::placeholder{color:var(--line);}
.login-name-box{
  border-radius:var(--radius-md);background:var(--primary-tint);color:var(--ink-soft);
  padding:14px 16px;font-size:15px;min-height:24px;
}
.login-name-box.resolved{color:var(--primary-dk);font-weight:700;background:var(--mint);}
.login-name-box.notfound{color:var(--danger);background:var(--danger-tint);}
</style>

async function scheduleReadCollection(collectionName, limitN){

// ---- 真正的班表快照讀取（依對方提供的路徑規格） ----
// 短時間快取（同一份月份文件 60 秒內只讀一次，並合併同時發出的請求）；
// 按「重新整理班表資料」會清除快取，仍可拿到最新結果
const SCHEDULE_CACHE_TTL_MS = 60 * 1000;
const __scheduleCache = {};   // monthKey -> {t, entries}
const __scheduleInflight = {}; // monthKey -> Promise
function clearScheduleCache(){
  for(const k of Object.keys(__scheduleCache)) delete __scheduleCache[k];
}
function fetchScheduleMonth(monthKey){
  const c = __scheduleCache[monthKey];
  if(c && Date.now() - c.t < SCHEDULE_CACHE_TTL_MS) return Promise.resolve(c.entries);
  if(__scheduleInflight[monthKey]) return __scheduleInflight[monthKey];
  const p = fetchScheduleMonthRaw(monthKey).then(entries=>{
    if(entries) __scheduleCache[monthKey] = { t:Date.now(), entries };
    return entries;
  }).finally(()=>{ delete __scheduleInflight[monthKey]; });
  __scheduleInflight[monthKey] = p;
  return p;
}
async function fetchScheduleMonthRaw(monthKey){
  try{
    if(!scheduleDbReady || !scheduleAuthReady){
      const ok = await initScheduleFirebase();
      if(!ok) throw new Error('班表系統連線失敗');
    }
    // 正確路徑（已用 Firebase Console 實際結構確認）：
    // artifacts/pharmacy-system-v1-8/public/data/roster/main/scheduleDirectory 是集合，
    // 月份（例如 2026-09）是這個集合底下的一份文件
    const ref = scheduleDb.collection(SCHEDULE_COLLECTION_PATH).doc(monthKey);
    const snap = await ref.get();
    if(!snap.exists){ console.warn('查無這個月份的班表文件：', monthKey); return null; }
    const data = snap.data();
    const entries = data ? (data.entries || null) : null;
    return entries;
  }catch(e){
    console.error('讀取班表快照失敗', e);
    return null;
  }
}
function dateStrToMonthDayKey(dateStr){
  const [y,m,d] = dateStr.split('-');
  return { monthKey: `${y}-${m}`, dayKey: String(parseInt(d,10)) };
}
// 取出真正的班別代碼：如果代碼裡有括號（例如「加強週(V8)」），取括號內的內容作為實際比對用的代碼
function extractRealCode(raw){
  if(!raw) return raw;
  const m = String(raw).match(/[（(]([^）)]+)[）)]/);
  return m ? m[1].trim() : String(raw).trim();
}
// 查詢某位員工在某一天的班別代碼（原始代碼，未做括號/後綴處理）
async function getShiftForEmployee(empNo, dateStr){
  if(!empNo) return null;
  const {monthKey, dayKey} = dateStrToMonthDayKey(dateStr);
  const entries = await fetchScheduleMonth(monthKey);
  if(!entries) return null;
  const raw = entries[empNo] ? entries[empNo][dayKey] : undefined;
  if(raw === undefined || raw === null || raw === '-') return null; // 空班/查無
  return raw;
}

function escAttr(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

/* =========================================================
   檔案上傳工具（圖片 / PDF / Word）— 存進 Firestore（免費方案可用，不需要 Storage）
   每個附件獨立存成一份文件，不會拖累主要資料的大小；
   Firestore 單一文件上限 1MB，所以單檔大小、PDF 畫質都要控制在安全範圍內。
   ========================================================= */
const ATTACHMENTS_COLLECTION = 'pharmacy_teaching_app_files';
const MAX_ATTACHMENT_BYTES = 700 * 1024; // 單檔上限 700KB（轉成 base64 後還會再大 33%，需留安全margin）
function humanFileSize(bytes){
  if(bytes < 1024*1024) return Math.round(bytes/1024)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
async function saveAttachmentDoc(id, data){
  if(!firebaseReady) throw new Error('Firebase 尚未設定完成，無法儲存檔案');
  await firestoreDb.collection(ATTACHMENTS_COLLECTION).doc(id).set(data);
}
async function loadAttachmentDoc(id){
  if(!firebaseReady) return null;
  const doc = await firestoreDb.collection(ATTACHMENTS_COLLECTION).doc(id).get();
  return doc.exists ? doc.data() : null;
}
async function deleteAttachmentDoc(id){
  if(!firebaseReady) return;
  try{ await firestoreDb.collection(ATTACHMENTS_COLLECTION).doc(id).delete(); }
  catch(e){ console.error('刪除附件文件失敗', e); }
}
function canvasToDataUrl(canvas, quality){ return canvas.toDataURL('image/jpeg', quality); }
async function waitForPdfjs(timeoutMs){
  const start = Date.now();
  while(typeof window.pdfjsLib === 'undefined'){
    if(Date.now()-start > timeoutMs) return false;
    await new Promise(r=>setTimeout(r,100));
  }
  return true;
}
async function rasterizePdfToPages(file){
  const ok = await waitForPdfjs(4000);
  if(!ok) throw new Error('pdf.js 尚未載入完成，請檢查網路連線後重新整理頁面再試一次');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const maxPages = Math.min(pdf.numPages, 15); // Firestore 空間有限，多頁 PDF 只保留前15頁
  const pages = [];
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 0.9}); // 畫質降低以控制檔案大小
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport: viewport}).promise;
    let quality = 0.55;
    let dataUrl = canvasToDataUrl(canvas, quality);
    // 若單頁還是太大，持續降低畫質，避免超過 Firestore 單一文件的大小上限
    while(dataUrl.length > 550*1024 && quality > 0.25){
      quality -= 0.1;
      dataUrl = canvasToDataUrl(canvas, quality);
    }
    pages.push(dataUrl);
  }
  return pages;
}
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label||'操作'}逾時（超過 ${ms/1000} 秒無回應，請檢查網路或 Firebase 設定）`)), ms))
  ]);
}
async function processUploadedFile(file){
  const name = file.name;
  const lower = name.toLowerCase();
  const id = uid('att');
  const looksLikeImage = file.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|bmp|jfif|heic|heif)$/i.test(lower);

  if(looksLikeImage){
    const data = await withTimeout(fileToDataUrl(file), 15000, '圖片讀取');
    await withTimeout(saveAttachmentDoc(id, {type:'image', name, data}), 15000, '圖片儲存');
    return {id, type:'image', name};
  }
  if(lower.endsWith('.pdf') || file.type==='application/pdf'){
    const pages = await withTimeout(rasterizePdfToPages(file), 60000, 'PDF 轉頁面圖片');
    // 每一頁分開存成一份文件，避免整份 PDF 超過 Firestore 單一文件 1MB 上限
    for(let i=0;i<pages.length;i++){
      await withTimeout(saveAttachmentDoc(`${id}_p${i+1}`, {type:'pdf_page', data:pages[i]}), 15000, `PDF 第${i+1}頁儲存`);
    }
    await withTimeout(saveAttachmentDoc(id, {type:'pdf', name, pageCount:pages.length}), 15000, 'PDF 資訊儲存');
    return {id, type:'pdf', name, pageCount: pages.length};
  }
  if(lower.endsWith('.docx')){
    let html = '';
    try{
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({arrayBuffer});
      html = result.value;
      if(html.length > 500000){ html = html.slice(0,500000) + '<p>（內容過長，已截斷）</p>'; }
    }catch(e){ console.error('mammoth convert failed', e); html = '<p>（無法預覽此檔案內容）</p>'; }
    await withTimeout(saveAttachmentDoc(id, {type:'docx', name, html}), 15000, 'Word 儲存');
    return {id, type:'docx', name};
  }
  if(lower.endsWith('.doc')){
    await withTimeout(saveAttachmentDoc(id, {type:'doc', name, html:'<p>舊版 .doc 格式無法預覽內容。</p>'}), 15000, 'Word 儲存');
    return {id, type:'doc', name};
  }
  throw new Error('不支援的檔案格式：'+name);
}

function moveAttInArray(arr, attId, dir){
  const i = arr.findIndex(a=>a.id===attId), j = i+dir;
  if(i<0 || j<0 || j>=arr.length) return false;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  return true;
}
window.__pdfPages = {};
function pdfSlideViewer(att, pages){
  const viewerId = 'pdfv_'+att.id;
  if(!pages || !pages.length){
    return `<div class="pdf-viewer" id="${viewerId}"><p style="font-size:12px;color:var(--danger);margin-bottom:8px;">此 PDF 目前無法在頁面內預覽。</p></div>`;
  }
  window.__pdfPages[att.id] = pages;
  return `
    <div class="pdf-viewer" id="${viewerId}" data-att="${att.id}" data-page="0">
      <img class="modal-img" id="${viewerId}_img" src="${pages[0]}" alt="${att.name} 第1頁">
      <div class="pdf-nav">
        <button class="btn btn-ghost btn-sm" onclick="pdfNav('${att.id}','${viewerId}',-1)">‹ 上一頁</button>
        <span class="pdf-page-label" id="${viewerId}_label">1 / ${pages.length}</span>
        <button class="btn btn-ghost btn-sm" onclick="pdfNav('${att.id}','${viewerId}',1)">下一頁 ›</button>
      </div>
      <div class="modal-img-cap">${att.name}</div>
    </div>`;
}
function pdfNav(attId, viewerId, dir){
  const pages = window.__pdfPages[attId] || [];
  const container = document.getElementById(viewerId);
  if(!container || !pages.length) return;
  let page = parseInt(container.dataset.page||'0',10);
  page = Math.min(pages.length-1, Math.max(0, page+dir));
  container.dataset.page = page;
  document.getElementById(viewerId+'_img').src = pages[page];
  document.getElementById(viewerId+'_label').textContent = (page+1)+' / '+pages.length;
}
async function fetchAttachmentForViewing(stub){
  try{
    if(stub.type==='pdf'){
      const pages = [];
      for(let i=1;i<=(stub.pageCount||0);i++){
        const doc = await loadAttachmentDoc(`${stub.id}_p${i}`);
        if(doc && doc.data) pages.push(doc.data);
      }
      return {...stub, pages};
    }
    const doc = await loadAttachmentDoc(stub.id);
    if(!doc) return {...stub, error:true};
    return {...stub, ...doc};
  }catch(e){
    console.error('讀取附件失敗', e);
    return {...stub, error:true};
  }
}
async function renderViewerAttachmentsAsync(attachments){
  if(!attachments || !attachments.length) return '';
  const hydrated = await Promise.all(attachments.map(fetchAttachmentForViewing));
  return hydrated.map(a=>{
    if(a.error){
      return `<p style="font-size:12px;color:var(--danger);">「${a.name}」載入失敗，請檢查網路連線。</p>`;
    }
    if(a.type==='image'){
      return `<img class="modal-img" src="${a.data}" alt="${a.name}"><div class="modal-img-cap">${a.name}</div>`;
    }
    if(a.type==='pdf'){
      return pdfSlideViewer(a, a.pages);
    }
    if(a.type==='docx' || a.type==='doc'){
      const preview = a.html ? `<div class="docx-preview" style="border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;max-height:320px;overflow-y:auto;font-size:12.5px;line-height:1.6;margin-bottom:8px;background:var(--bg);">${a.html}</div>` : '<p style="font-size:12px;color:var(--ink-soft);">此檔案無法預覽。</p>';
      return preview;
    }
    return '';
  }).join('');
}

    "teachingPoints": [{"id": "tp_grind_prn", "title": "PRN／AS ORDER 醫囑之磨粉包數計算", "bullets": ["頻次為 PRN 或 AS ORDER 時，藥品總量可由醫師手動輸入，系統試算的磨粉包數可能與實際應磨粉包數不符", "務必依「使用天數」與醫囑上實際的每次用量、頻次人工複核，勿直接以系統顯示的磨粉包數為準", "範例：Inderal 10mg，1 tab BID PRN 共 28 tab，28 天磨 → 系統顯示磨粉 56 包，實際應為 28 錠磨粉 28 包"], "image": ""}, {"id": "tp_grind_er_hold", "title": "急診暫留病人之給藥總量顯示", "bullets": ["急診暫留病人的藥量，系統會自動只計算到當日下午 3 點，因此開立時間會直接影響系統顯示的給藥總量", "早上開立 vs. 下午開立，同一張醫囑系統算出的總量、磨粉包數可能不同，須依實際醫囑時間人工核算", "範例：早上 11 點開立 QID，系統只給 1 錠（中午）；下午 3:30 開立 QD，系統給 2 錠（QD+STAT）"], "image": ""}, {"id": "tp_grind_stat", "title": "STAT（立即使用）醫囑之磨粉換算", "bullets": ["STAT 為單次立即使用醫囑，磨粉常需採「取部分量」方式處理，例如 1 錠磨 3 包、僅需交付其中 1 包", "系統顯示的磨粉包數不一定等於實際應交付的包數，務必依醫囑內容人工判讀後再決定磨粉包數", "範例：Acetaminophen 1/3 tab STAT，共 1 錠，系統顯示磨粉 1 包，但實際應為 1 錠磨 3 包、僅取 1 包"], "image": ""}],

// 修復舊資料：早期示範資料把圖片直接用 base64 內嵌在教學重點的 image 欄位裡，
// 這會讓主資料庫文件越來越大，撞到 Firestore 單一文件 1MB 上限造成整個 App 存不進資料。
// 這裡會自動把過大的內嵌圖片搬到獨立的附件集合，並把主文件裡的欄位清空瘦身。
const INLINE_IMAGE_SIZE_THRESHOLD = 30000; // 約 30KB以上就視為過大
async function migrateOversizedInlineImages(){
  if(!firebaseReady || !DB.stations) return;
  let changed = false;
  for(const st of DB.stations){
    for(const tp of (st.teachingPoints||[])){
      if(tp.image && tp.image.length > INLINE_IMAGE_SIZE_THRESHOLD){
        try{
          const id = uid('att');
          await saveAttachmentDoc(id, {type:'image', name: tp.title || '教學圖片', data: tp.image});
          if(!tp.attachments) tp.attachments = [];
          tp.attachments.push({id, type:'image', name: tp.title || '教學圖片'});
          tp.image = '';
          changed = true;
        }catch(e){ console.error('搬移內嵌圖片失敗', e); }
      }
    }
  }
  if(changed){
    console.warn('已自動將過大的內嵌圖片搬移到獨立附件，並精簡主資料庫文件大小。');
    await persist();
  }
}


let DB = null;
let firebaseConfigMissing = false;

let dbLoadFailed = false;
async function loadDB(){
  const ok = initFirebase();
  if(!ok){
    firebaseConfigMissing = true;
    DB = withIncidentCategories(buildDefaultData());
    return;
  }
  try{
    const doc = await firestoreDb.collection(FIRESTORE_DOC_PATH[0]).doc(FIRESTORE_DOC_PATH[1]).get();
    if(doc.exists){
      DB = doc.data();
      baseDB = cloneJSON(DB);
      migrateDB();
      await migrateOversizedInlineImages();
      return;
    }
    // 文件真的「從來不存在」（第一次安裝），這種情況下才安全地寫入示範資料
    DB = withIncidentCategories(buildDefaultData());
    await migrateOversizedInlineImages();
    baseDB = null;
    await persist();
  }catch(e){
    // 讀取失敗（網路問題、權限問題、任何原因）絕對不能自動覆蓋掉可能已經存在的真實資料庫內容！
    // 只在記憶體裡暫時顯示示範資料讓畫面不至於完全空白，但「不會」寫回資料庫，
    // 並且會擋住所有畫面、顯示明確錯誤，避免使用者誤以為一切正常而繼續操作、進而把示範資料存進去蓋掉真實資料。
    console.error('Firestore 讀取失敗，為了保護您的真實資料，不會自動寫入任何內容', e);
    dbLoadFailed = true;
    DB = withIncidentCategories(buildDefaultData());
  }
}

const BACKUPS_COLLECTION = 'pharmacy_teaching_app_backups';
const MAX_BACKUPS_TO_KEEP = 30; // 保留最近30天，避免備份無限增加
let backupDoneToday = false;
async function ensureDailyBackup(){
  if(backupDoneToday || !firebaseReady) return;
  try{
    const today = todayStr();
    const backupRef = firestoreDb.collection(BACKUPS_COLLECTION).doc(today);
    const existing = await backupRef.get();
    if(!existing.exists){
      // 備份「今天第一次存檔之前」資料庫實際存在的內容（也就是目前為止最後一次成功存檔的狀態）
      const mainDoc = await firestoreDb.collection(FIRESTORE_DOC_PATH[0]).doc(FIRESTORE_DOC_PATH[1]).get();
      if(mainDoc.exists){
        await backupRef.set({ ...mainDoc.data(), _backedUpAt: new Date().toISOString() });
        cleanupOldBackups().catch(e=>console.error('清理舊備份失敗（不影響備份本身）', e));
      }
    }
    backupDoneToday = true;
  }catch(e){ console.error('每日備份失敗（不影響正常使用，但這次沒有備份到）', e); }
}
async function cleanupOldBackups(){
  const snap = await firestoreDb.collection(BACKUPS_COLLECTION).get();
  const ids = snap.docs.map(d=>d.id).sort(); // 日期字串格式 YYYY-MM-DD，字串排序等同時間排序
  if(ids.length <= MAX_BACKUPS_TO_KEEP) return;
  const toDelete = ids.slice(0, ids.length - MAX_BACKUPS_TO_KEEP);
  for(const id of toDelete){
    await firestoreDb.collection(BACKUPS_COLLECTION).doc(id).delete();
  }
}
/* =========================================================
   多人同時編輯：三方合併（base = 本機上次與雲端同步的內容、local = 本機現在、remote = 雲端現在）
   每次儲存都在 Firestore transaction 內讀取雲端最新內容、合併後再寫回，
   所以不同裝置同時新增/修改的資料都會保留，不會再整份被蓋掉。
   ========================================================= */
let baseDB = null; // 本機最後一次與雲端同步完成的快照
function cloneJSON(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function deepEqual(a, b){
  if(a === b) return true;
  if(a === undefined || b === undefined || a === null || b === null) return false;
  if(typeof a !== 'object' || typeof b !== 'object') return false;
  if(Array.isArray(a) !== Array.isArray(b)) return false;
  if(Array.isArray(a)){
    if(a.length !== b.length) return false;
    for(let i=0;i<a.length;i++) if(!deepEqual(a[i], b[i])) return false;
    return true;
  }
  const ka = Object.keys(a), kb = Object.keys(b);
  if(ka.length !== kb.length) return false;
  for(const k of ka){ if(!(k in b) || !deepEqual(a[k], b[k])) return false; }
  return true;
}
function isPlainObj(x){ return x !== null && typeof x === 'object' && !Array.isArray(x); }
function mergeKeyOf(item){ return isPlainObj(item) && item.id !== undefined && item.id !== null ? 'id:'+item.id : null; }
function arrayHasIds(arr){ return Array.isArray(arr) && arr.every(x=>mergeKeyOf(x)!==null); }
function mergeArrays(base, local, remote){
  base = base || [];
  const all = [].concat(base, local, remote);
  if(all.length && all.every(x=>mergeKeyOf(x)!==null)){
    // 以 id 為單位合併：各自新增的都保留、各自修改不同項目都保留、同一項目再往內遞迴合併
    const mapOf = arr => { const m = new Map(); arr.forEach(x=>m.set(mergeKeyOf(x), x)); return m; };
    const B = mapOf(base), L = mapOf(local), R = mapOf(remote);
    const out = [], seen = new Set();
    const handle = key => {
      if(seen.has(key)) return; seen.add(key);
      const b = B.get(key), l = L.get(key), r = R.get(key);
      if(l === undefined && r === undefined) return;          // 兩邊都已刪除
      if(l === undefined){                                    // 本機刪除
        if(b !== undefined && deepEqual(b, r)) return;        //   雲端沒動過 → 刪除成立
        out.push(r); return;                                  //   雲端有改過 → 保留（避免誤刪別人剛改的）
      }
      if(r === undefined){                                    // 雲端刪除
        if(b !== undefined && deepEqual(b, l)) return;        //   本機沒動過 → 刪除成立
        out.push(l); return;                                  //   本機有改過 → 保留
      }
      out.push(b === undefined ? (deepEqual(l, r) ? r : mergeValues(undefined, l, r)) : mergeValues(b, l, r));
    };
    remote.forEach(x=>handle(mergeKeyOf(x)));   // 順序以雲端為主
    local.forEach(x=>handle(mergeKeyOf(x)));    // 本機新增的接在後面
    return out;
  }
  // 沒有 id 的陣列（字串、數字、日誌等）：當成集合處理，保留雙方新增、套用雙方刪除
  const key = x => JSON.stringify(x);
  const B = new Set(base.map(key)), L = new Set(local.map(key)), R = new Set(remote.map(key));
  const out = [];
  remote.forEach(x=>{ const k=key(x); if(B.has(k) && !L.has(k)) return; out.push(x); }); // 本機刪掉的
  local.forEach(x=>{ const k=key(x); if(!B.has(k) && !R.has(k)) out.push(x); });         // 本機新增的
  return out;
}
function mergeValues(base, local, remote){
  if(deepEqual(local, remote)) return remote;
  if(base !== undefined && deepEqual(local, base)) return remote;   // 本機沒改 → 用雲端
  if(base !== undefined && deepEqual(remote, base)) return local;   // 雲端沒改 → 用本機
  if(isPlainObj(local) && isPlainObj(remote)){
    const b = isPlainObj(base) ? base : {};
    const out = {};
    const keys = new Set([].concat(Object.keys(local), Object.keys(remote)));
    keys.forEach(k=>{
      const hasL = k in local, hasR = k in remote, hasB = k in b;
      if(hasL && hasR){ out[k] = mergeValues(hasB ? b[k] : undefined, local[k], remote[k]); }
      else if(hasL){ // 只有本機有
        if(hasB && deepEqual(b[k], local[k])) return;  // 雲端刪除、本機沒動 → 刪除成立
        out[k] = local[k];
      }else{ // 只有雲端有
        if(hasB && deepEqual(b[k], remote[k])) return; // 本機刪除、雲端沒動 → 刪除成立
        out[k] = remote[k];
      }
    });
    return out;
  }
  if(Array.isArray(local) && Array.isArray(remote)){
    return mergeArrays(Array.isArray(base) ? base : [], local, remote);
  }
  return local; // 同一個欄位兩邊都改成不同的值：以本機（最新操作者）為準
}
function merge3(base, local, remote){ return mergeValues(base, local, remote); }

let __persistChain = Promise.resolve();
function persist(opts){
  // 所有儲存排隊依序執行，避免同一個裝置自己連按多次互相打架
  __persistChain = __persistChain.then(()=>persistOnce(opts || {}), ()=>persistOnce(opts || {}));
  return __persistChain;
}
async function persistOnce(opts){
  if(!firebaseReady){ firebaseConfigMissing = true; return; }
  try{
    const ref = firestoreDb.collection(FIRESTORE_DOC_PATH[0]).doc(FIRESTORE_DOC_PATH[1]);
    if(opts.overwrite){
      // 還原備份：明確要整份覆蓋，不做合併
      await ensureDailyBackup();
      await ref.set(DB);
      baseDB = cloneJSON(DB);
      return;
    }
    await ensureDailyBackup();
    const local = cloneJSON(DB);
    let merged = null;
    await firestoreDb.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      if(!snap.exists){ merged = local; tx.set(ref, local); return; }
      const remote = snap.data();
      merged = merge3(baseDB || remote, local, remote);
      if(!deepEqual(merged, remote)) tx.set(ref, merged);
    });
    const changedByOthers = !deepEqual(merged, local);
    baseDB = cloneJSON(merged);
    if(changedByOthers && DB){
      // 把別的裝置的更動帶進本機畫面；若使用者正在輸入文字則先不重繪，下次操作就會看到
      DB = merged;
      try{ migrateDB(); }catch(e){}
      const ae = document.activeElement;
      const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
      if(!typing && typeof renderApp === 'function'){ try{ renderApp(); }catch(e){} }
    }
  }catch(e){
    console.error('Firestore 寫入失敗', e);
    showToast('儲存失敗，請檢查網路連線或 Firebase 設定');
  }
}

function stripCodeSuffix(v){ return String(v||'').trim().split(/[\/#]/)[0].trim(); }
// 正規化一個原始班別代碼：先去掉 / # 之類的後綴，再檢查有沒有括號（例如「加強週(V8)」），
// 有的話取括號內的內容當作真正用來比對的代碼
function normalizeCode(raw){
  if(!raw) return null;
  const stripped = stripCodeSuffix(raw);
  return extractRealCode(stripped) || null;
}
function resolveStationForCode(code){
  if(!code) return null;
  const m = DB.codeMap.find(c=>c.code===code);
  return m ? findStation(m.stationId) : null;

// 查某位學員在某一天的正規化班別代碼（真正打去問班表系統）
async function getRosterCodeReal(date, empNo){
  const raw = await getShiftForEmployee(empNo, date);
  return normalizeCode(raw);
}
// 在某一天，找出誰的班別代碼跟目標代碼相同（排除自己），優先回傳身份為「藥師」的人
async function findMentorForCodeReal(date, code, excludeEmpNo){
  const {monthKey, dayKey} = dateStrToMonthDayKey(date);
  const entries = await fetchScheduleMonth(monthKey);
  if(!entries) return null;
  let fallback = null;
  for(const empNo of Object.keys(entries)){
    if(empNo === excludeEmpNo) continue;
    const raw = entries[empNo] ? entries[empNo][dayKey] : undefined;
    if(raw===undefined || raw===null || raw==='-') continue;
    const code2 = normalizeCode(raw);
    if(code2 === code){
      const emp = findEmployeeByEmpNo(empNo);
      if(emp && emp.role==='staff') return emp.name;
      if(!fallback && emp) fallback = emp.name;
    }
  }
  return fallback;
}
async function computeAutoSchedule(employeeName, date){
  const emp = findEmployeeByName(employeeName);
  if(!emp) return null;
  const code = await getRosterCodeReal(date, emp.empNo);
  if(!code) return null;
  const station = resolveStationForCode(code);
  if(!station) return null;
  const mentor = await findMentorForCodeReal(date, code, emp.empNo);
  if(!mentor) return null;
  return {station, mentor, code};
}
async function findTraineesMentoredBy(staffName, date){
  const trainees = DB.employees.filter(e=>e.role==='trainee');
  const out = [];
  for(const t of trainees){
    const auto = await computeAutoSchedule(t.name, date);
    if(auto && auto.mentor===staffName) out.push({trainee:t, station:auto.station});
  }
  return out;
}

function getChecked(stationId, traineeName){ return DB.progress[progressKey(stationId, traineeName)] || []; }
function totalItems(station){ return station.categories.filter(c=>!c.isIncident).reduce((a,c)=>a+c.items.length,0); }
function checkedCount(station, traineeName){ const arr=getChecked(station.id, traineeName); return station.categories.filter(c=>!c.isIncident).reduce((a,c)=>a+c.items.filter(i=>arr.includes(i.id)).length,0); }
function percentDone(station, traineeName){ if(!traineeName) return 0; const t=totalItems(station); if(!t) return 0; return Math.round(checkedCount(station, traineeName)/t*100); }

async function toggleItem(stationId, itemId, traineeName){
  if(!traineeName){ showToast('請先選擇要記錄進度的學員'); return; }
  const user = currentUser();
  if(!(user && user.role==='trainee' && user.name===traineeName)){
    showToast('只有學員本人登入後才能勾選檢核項目');
    return;
  }
  const key = progressKey(stationId, traineeName);
  if(DB.progressLocks && DB.progressLocks[key]){
    showToast('這個站別已完訓鎖定，如需修改請洽管理者解鎖');
    return;
  }
  const arr = DB.progress[key] ? DB.progress[key].slice() : [];
  const idx = arr.indexOf(itemId);
  const nowChecking = idx===-1;
  if(idx>-1) arr.splice(idx,1); else arr.push(itemId);
  DB.progress[key] = arr;

  // 記錄學習歷程：誰、在哪個站別、勾了哪一項、當時的導師是誰
  const st = findStation(stationId);
  const item = st ? st.categories.flatMap(c=>c.items).find(i=>i.id===itemId) : null;
  const today = todayStr();
  const auto = await computeAutoSchedule(traineeName, today);
  if(!DB.learningLog) DB.learningLog = [];
  DB.learningLog.push({
    id: uid('log'),
    traineeName,
    stationId,
    stationName: st ? st.name : '',
    itemId,
    itemText: item ? item.text : '',
    checked: nowChecking,
    mentor: auto ? auto.mentor : null,
    date: today,
    timestamp: new Date().toISOString(),
  });

  // 全部項目都勾完了：自動鎖定，避免之後不小心誤觸取消勾選
  if(st){
    const total = totalItems(st);
    const doneCount = st.categories.reduce((a,c)=>a+c.items.filter(i=>arr.includes(i.id)).length,0);
    if(total>0 && doneCount===total){
      if(!DB.progressLocks) DB.progressLocks = {};
      DB.progressLocks[key] = true;
    }
  }

  await persist();
  renderApp();
  const stAfter = findStation(stationId);
  if(stAfter && DB.progressLocks && DB.progressLocks[key]){
    showToast('🎉 本站已全部完成，已自動鎖定！如需修改請洽管理者解鎖');
  }
}
async function unlockStationProgress(stationId, traineeName){
  if(!confirm(`確定要解鎖「${traineeName}」在這個站別的檢核，讓他可以繼續修改嗎？`)) return;
  const key = progressKey(stationId, traineeName);
  if(!DB.progressLocks) DB.progressLocks = {};
  DB.progressLocks[key] = false;
  await persist();
  renderApp();
  showToast('已解鎖');
}

function blisterMini(pct){
  const total=8; const on=Math.round(pct/100*total);
  let caps='';
  for(let i=0;i<total;i++) caps += `<div class="cap ${i<on?'on':''}"></div>`;
  return `<div class="blister">${caps}</div>`;
}
function blisterRow(pct){
  const total=10; const on=Math.round(pct/100*total);
  let caps='';
  for(let i=0;i<total;i++) caps += `<div class="cap ${i<on?'on':''}"></div>`;
  return `<div class="blister-row">${caps}</div>`;
}
function initials(name){ return name ? name[0] : '?'; }

let modalHtml = '';
function openModal(html){ modalHtml = html; renderApp(); }
function closeModal(){ modalHtml=''; renderApp(); }

let toastMsg = '';
function showToast(msg){
  // 直接操作獨立的 toast 元素，不觸發整頁重繪，避免打斷使用者正在輸入的欄位（例如登入畫面）
  let el = document.getElementById('global-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'global-toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 1800);
}

async function findAnyStaffForStation(stationId, date){
  const codes = DB.codeMap.filter(c=>c.stationId===stationId).map(c=>c.code);
  if(!codes.length) return null;
  const {monthKey, dayKey} = dateStrToMonthDayKey(date);
  const entries = await fetchScheduleMonth(monthKey);
  if(!entries) return null;
  for(const empNo of Object.keys(entries)){
    const raw = entries[empNo] ? entries[empNo][dayKey] : undefined;
    if(raw===undefined || raw===null || raw==='-') continue;
    const code2 = normalizeCode(raw);
    if(codes.includes(code2)){
      const emp = findEmployeeByEmpNo(empNo);
      if(emp && emp.role==='staff') return {name:emp.name, code:code2};
    }
  }
  return null;
}

/* =========================================================
   工作流程（依時段分組的詳細步驟）
   st.flow = [{id, title, steps:[{id, text, detail, important, image, attachments}]}]
   勾選紀錄獨立存在 DB.flowProgress，不影響原本檢核表的完成度、鎖定與學習歷程
   ========================================================= */
function flowEsc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setStationTab(t){ S.stationTab = t; renderApp(); }
function getFlowChecked(stationId, traineeName){ return (DB.flowProgress && DB.flowProgress[progressKey(stationId, traineeName)]) || []; }
function flowTotalSteps(st){ return (st.flow||[]).reduce((a,g)=>a+g.steps.length,0); }
function renderStationFlow(st, c, traineeName, canCheck){
  const groups = st.flow || [];
  if(!groups.length) return '<p style="font-size:12.5px;color:var(--ink-soft);">這個站別尚未設定工作流程，請管理者到後台「編輯站別」新增。</p>';
  const arr = traineeName ? getFlowChecked(st.id, traineeName) : [];
  const total = flowTotalSteps(st);
  const done = groups.reduce((a,g)=>a+g.steps.filter(x=>arr.includes(x.id)).length,0);
  const summary = traineeName && total ? `<div class="hint-banner">🕐 流程熟悉度：${done}/${total}（僅供自我確認，不影響檢核表完成度）</div>` : '';
  const hint = (traineeName && !canCheck) ? '<p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;">🔒 只有學員本人登入後才能勾選。</p>' : '';
  const blocks = groups.map((g,gi)=>`
    <div class="cat-block">
      <div class="cat-title"><span class="cat-num">${gi+1}</span>${flowEsc(g.title)}</div>
      ${g.steps.length ? g.steps.map((x,xi)=>{
        const isChecked = arr.includes(x.id);
        const hasMedia = !!(x.image || (x.attachments && x.attachments.length));
        const attrs = canCheck ? `onclick="event.stopPropagation();toggleFlowStep('${st.id}','${x.id}','${traineeName}')"` : `disabled title="只有學員本人可以勾選"`;
        return `
        <div class="check-row ${isChecked?'checked':''} ${x.important?'important':''}">
          <input type="checkbox" ${isChecked?'checked':''} ${attrs}>
          <div class="txt" ${hasMedia?`onclick="openFlowStepModal('${st.id}','${g.id}','${x.id}')"`:''} style="${hasMedia?'':'cursor:default;'}">
            <div class="line"><b>${gi+1}.${xi+1}</b> ${flowEsc(x.text)}${hasMedia?'<span class="info-dot">i</span>':''}</div>
            ${x.important?'<div class="note">* 重點注意</div>':''}
            ${x.detail?`<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;white-space:pre-wrap;line-height:1.55;">${flowEsc(x.detail)}</div>`:''}
          </div>
        </div>`;
      }).join('') : '<p style="font-size:12px;color:var(--ink-soft);margin:4px 0;">此時段尚無步驟。</p>'}
    </div>`).join('');
  return `<div class="block-title" style="margin-top:6px;">🕐 工作流程</div>${summary}${hint}${blocks}`;
}
async function toggleFlowStep(stationId, stepId, traineeName){
  const user = currentUser();
  if(!(traineeName && user && user.role==='trainee' && user.name===traineeName)){ showToast('只有學員本人登入後才能勾選'); return; }
  if(!DB.flowProgress) DB.flowProgress = {};
  const key = progressKey(stationId, traineeName);
  const arr = (DB.flowProgress[key]||[]).slice();
  const i = arr.indexOf(stepId);
  if(i>-1) arr.splice(i,1); else arr.push(stepId);
  DB.flowProgress[key] = arr;
  await persist();
  renderApp();
}
async function openFlowStepModal(stId, gId, xId){
  const st = findStation(stId);
  const g = st && (st.flow||[]).find(g=>g.id===gId);
  const x = g && g.steps.find(x=>x.id===xId);
  if(!x) return;
  openModal(`<div class="modal-top"><h4>${flowEsc(x.text)}</h4><button class="modal-close" onclick="closeModal()">✕</button></div><p style="font-size:12px;color:var(--ink-soft);text-align:center;padding:16px 0;">載入中…</p>`);
  const attHtml = await renderViewerAttachmentsAsync(x.attachments);
  openModal(`
    <div class="modal-top"><h4>${flowEsc(x.text)}</h4><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${x.image ? `<img class="modal-img" src="${escAttr(x.image)}" alt="${escAttr(x.text)}">` : ''}
    ${attHtml}
    ${x.detail ? `<p style="font-size:13px;white-space:pre-wrap;line-height:1.65;">${flowEsc(x.detail)}</p>` : ''}
    <button class="btn btn-primary btn-block" onclick="closeModal()">關閉</button>
  `);
}

function flowFind(stId, gId, xId){
  const st = findStation(stId);
  const g = st && (st.flow||[]).find(g=>g.id===gId);
  const x = g && xId ? g.steps.find(x=>x.id===xId) : null;
  return {st, g, x};
}
function flowMove(arr, id, dir){
  const i = arr.findIndex(a=>a.id===id), j = i+dir;
  if(i<0 || j<0 || j>=arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}
async function addFlowGroup(stId){
  const st = findStation(stId); if(!st.flow) st.flow = [];
  const name = prompt('時段名稱', '');
  if(name === null) return;
  st.flow.push({id:uid('fg'), title:name.trim() || '新時段', steps:[]});
  await persist(); renderApp();
}
async function renameFlowGroup(stId, gId){
  const {g} = flowFind(stId, gId); if(!g) return;
  const name = prompt('時段名稱', g.title);
  if(name === null || !name.trim()) return;
  g.title = name.trim(); await persist(); renderApp();
}
async function deleteFlowGroup(stId, gId){
  const {st, g} = flowFind(stId, gId); if(!g) return;
  if(!confirm(`確定要刪除時段「${g.title}」與底下的 ${g.steps.length} 個步驟嗎？`)) return;
  st.flow = st.flow.filter(x=>x.id!==gId);
  await persist(); renderApp();
  g.steps.forEach(x=>(x.attachments||[]).forEach(a=>deleteAttachmentAndPages(a)));
}
async function moveFlowGroup(stId, gId, dir){
  const {st} = flowFind(stId, gId); if(!st) return;
  flowMove(st.flow, gId, dir); await persist(); renderApp();
}
async function addFlowStep(stId, gId){
  const {g} = flowFind(stId, gId); if(!g) return;
  const x = {id:uid('fs'), text:'新步驟', detail:'', important:false, image:'', attachments:[]};
  g.steps.push(x);
  await persist();
  renderApp();
  editFlowStep(stId, gId, x.id);
}
async function deleteFlowStep(stId, gId, xId){
  const {g, x} = flowFind(stId, gId, xId); if(!x) return;
  if(!confirm(`確定要刪除步驟「${x.text}」嗎？`)) return;
  g.steps = g.steps.filter(s=>s.id!==xId);
  await persist(); renderApp();
  (x.attachments||[]).forEach(a=>deleteAttachmentAndPages(a));
}
async function moveFlowStep(stId, gId, xId, dir){
  const {g} = flowFind(stId, gId); if(!g) return;
  flowMove(g.steps, xId, dir); await persist(); renderApp();
}
function editFlowStep(stId, gId, xId){
  const {x} = flowFind(stId, gId, xId); if(!x) return;
  openModal(`
    <div class="modal-top"><h4>編輯步驟</h4><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-group"><label>步驟標題</label><input type="text" id="edit-fs-text" value="${escAttr(x.text)}"></div>
    <div class="form-group"><label>詳細說明</label><textarea id="edit-fs-detail" style="min-height:120px;">${flowEsc(x.detail||'')}</textarea></div>
    <div class="form-group"><label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="edit-fs-important" ${x.important?'checked':''} style="width:auto;"> 標記為重點／注意</label></div>
    <div class="form-group"><label>圖片網址（選填，也可用下方上傳檔案）</label><input type="text" id="edit-fs-image" value="${escAttr(x.image||'')}"></div>
    <div class="subhead" style="margin-top:14px;">附件（圖片／PDF／Word）</div>
    ${renderAdminAttachmentChips(x.attachments, `removeFlowAttachment('${stId}','${gId}','${xId}',`, `moveFlowAttachment('${stId}','${gId}','${xId}',`)}
    <input type="file" id="fs-att-input" accept="image/*,.pdf,.doc,.docx" multiple style="width:100%;margin-bottom:6px;">
    <p style="font-size:11px;color:var(--ink-soft);margin:0 0 8px;">單檔請控制在 700KB 以內。</p>
    <button class="btn btn-ghost btn-block" style="margin-bottom:6px;" onclick="uploadFlowAttachments('${stId}','${gId}','${xId}')">上傳選取的檔案</button>
    <div id="fs-att-status" style="margin-bottom:10px;"></div>
    <button class="btn btn-primary btn-block" onclick="saveFlowStep('${stId}','${gId}','${xId}')">儲存</button>
  `);
}
function applyFlowModalFields(x){
  forceCommitActiveInput();
  const t = document.getElementById('edit-fs-text');
  if(!t) return;
  x.text = t.value.trim() || x.text;
  x.detail = document.getElementById('edit-fs-detail').value;
  x.important = document.getElementById('edit-fs-important').checked;
  x.image = document.getElementById('edit-fs-image').value.trim();
}
async function saveFlowStep(stId, gId, xId){
  const {x} = flowFind(stId, gId, xId); if(!x) return;
  applyFlowModalFields(x);
  await persist(); closeModal(); renderApp(); showToast('已儲存步驟');
}
async function uploadFlowAttachments(stId, gId, xId){
  const {x} = flowFind(stId, gId, xId); if(!x) return;
  const input = document.getElementById('fs-att-input');
  const files = Array.from((input && input.files) || []);
  if(!files.length){ setUploadStatus('fs-att-status', '<p style="color:var(--danger);font-size:11.5px;">請先選擇檔案</p>'); return; }
  setUploadStatus('fs-att-status', '<p style="color:var(--ink-soft);font-size:11.5px;">上傳中，請稍候…</p>');
  applyFlowModalFields(x);
  const newAtts = [], errors = [];
  for(const file of files){
    if(file.size > MAX_ATTACHMENT_BYTES){ errors.push(`${file.name} 超過 ${humanFileSize(MAX_ATTACHMENT_BYTES)}`); continue; }
    try{ newAtts.push(await processUploadedFile(file)); }
    catch(e){ console.error(e); errors.push(`${file.name} 上傳失敗：${e.message||e}`); }
  }
  x.attachments = (x.attachments||[]).concat(newAtts);
  await persist();
  editFlowStep(stId, gId, xId);
  setUploadStatus('fs-att-status', errors.length
    ? `<p style="color:var(--danger);font-size:11.5px;">已上傳 ${newAtts.length} 個檔案；失敗：${errors.join('；')}</p>`
    : `<p style="color:var(--primary-dk);font-size:11.5px;">✓ 已上傳 ${newAtts.length} 個檔案</p>`);
}
async function removeFlowAttachment(stId, gId, xId, attId){
  const {x} = flowFind(stId, gId, xId); if(!x) return;
  const removed = (x.attachments||[]).find(a=>a.id===attId);
  applyFlowModalFields(x);
  x.attachments = (x.attachments||[]).filter(a=>a.id!==attId);
  await persist();
  if(removed) deleteAttachmentAndPages(removed);
  editFlowStep(stId, gId, xId);
}

/* =========================================================
   P&P：全站共用。DB.ppTabs = [{id, title, items:[{id, title, detail, image, attachments}]}]
   子分頁（tab）由管理者自行新增
   ========================================================= */
function ppEsc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ppMove(arr, id, dir){
  const i = arr.findIndex(a=>a.id===id), j = i+dir;
  if(i<0 || j<0 || j>=arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}
function ppFind(tabId, itemId){
  const tab = (DB.ppTabs||[]).find(t=>t.id===tabId);
  const item = tab && itemId ? tab.items.find(x=>x.id===itemId) : null;
  return {tab, item};
}
function ppCurrentTab(stateKey){
  const tabs = DB.ppTabs || [];
  return tabs.find(t=>t.id===S[stateKey]) || tabs[0] || null;
}
function setPPTab(id){ S.ppTab = id; renderApp(); }

/* ---- Excel（含內嵌圖片）匯入解析 ---- */
function xmlAttr(tag, name){
  if(!tag) return null;
  const m = tag.match(new RegExp(name+'="([^"]*)"'));
  return m ? m[1] : null;
}
function zipResolvePath(fromFile, target){
  if(/^\//.test(target)) return target.replace(/^\//,'');
  const parts = fromFile.split('/'); parts.pop();
  target.split('/').forEach(p=>{
    if(p==='..') parts.pop(); else if(p!=='.' && p!=='') parts.push(p);
  });
  return parts.join('/');
}
function zipRelsPathFor(path){
  const idx = path.lastIndexOf('/');
  const dir = path.slice(0,idx), file = path.slice(idx+1);
  return dir+'/_rels/'+file+'.rels';
}
function mimeForPath(path){
  const ext = (path.split('.').pop()||'').toLowerCase();
  return {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',bmp:'image/bmp',webp:'image/webp'}[ext] || 'image/png';
}
async function extractXlsxImages(zip, sheetIndex){
  // 回傳 { rowIndex: { colIndex: dataURL } }（row/col 皆為 0-based，對應 SheetJS 以 header:1 讀出的陣列索引）
  const result = {};
  try{
    const wbXml = await zip.file('xl/workbook.xml').async('text');
    const wbRelsFile = zip.file('xl/_rels/workbook.xml.rels');
    if(!wbRelsFile) return result;
    const wbRelsXml = await wbRelsFile.async('text');
    const sheetTags = wbXml.match(/<sheet\b[^>]*>/g) || [];
    const sheetRid = xmlAttr(sheetTags[sheetIndex]||'', 'r:id');
    if(!sheetRid) return result;
    const relTags = wbRelsXml.match(/<Relationship\b[^>]*>/g) || [];
    const rel = relTags.map(t=>({id:xmlAttr(t,'Id'), target:xmlAttr(t,'Target')})).find(r=>r.id===sheetRid);
    if(!rel) return result;
    const sheetPath = zipResolvePath('xl/workbook.xml', rel.target);
    const sheetRelsPath = zipRelsPathFor(sheetPath);
    const sheetRelsFile = zip.file(sheetRelsPath);
    if(!sheetRelsFile) return result;
    const sheetRelsXml = await sheetRelsFile.async('text');
    const sRelTags = sheetRelsXml.match(/<Relationship\b[^>]*>/g) || [];
    const drawRel = sRelTags.map(t=>({target:xmlAttr(t,'Target')})).find(r=>r.target && r.target.indexOf('drawing')>-1);
    if(!drawRel) return result;
    const drawingPath = zipResolvePath(sheetPath, drawRel.target);
    const drawingFile = zip.file(drawingPath);
    if(!drawingFile) return result;
    const drawingXml = await drawingFile.async('text');
    const drawingRelsPath = zipRelsPathFor(drawingPath);
    const drawingRelsFile = zip.file(drawingRelsPath);
    if(!drawingRelsFile) return result;
    const drawingRelsXml = await drawingRelsFile.async('text');
    const dRelTags = drawingRelsXml.match(/<Relationship\b[^>]*>/g) || [];
    const embedMap = {};
    dRelTags.forEach(t=>{ const id=xmlAttr(t,'Id'), target=xmlAttr(t,'Target'); if(id&&target) embedMap[id]=zipResolvePath(drawingPath, target); });
    const anchorBlocks = drawingXml.match(/<xdr:(?:twoCellAnchor|oneCellAnchor)\b[\s\S]*?<\/xdr:(?:twoCellAnchor|oneCellAnchor)>/g) || [];
    for(const block of anchorBlocks){
      const fromMatch = block.match(/<xdr:from>[\s\S]*?<xdr:col>(\d+)<\/xdr:col>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>[\s\S]*?<\/xdr:from>/);
      const embedMatch = block.match(/r:embed="(rId\d+)"/);
      if(!fromMatch || !embedMatch) continue;
      const col = parseInt(fromMatch[1],10), row = parseInt(fromMatch[2],10);
      const mediaPath = embedMap[embedMatch[1]];
      if(!mediaPath) continue;
      const mediaFile = zip.file(mediaPath);
      if(!mediaFile) continue;
      const base64 = await mediaFile.async('base64');
      const dataUrl = 'data:'+mimeForPath(mediaPath)+';base64,'+base64;
      if(!result[row]) result[row]={};
      result[row][col] = dataUrl;
    }
  }catch(e){ console.error('題庫 Excel 圖片解析失敗（文字部分仍會正常匯入）', e); }
  return result;
}
function parseQuizOptionsText(raw){
  const out = {};
  if(!raw) return out;
  String(raw).split(/\r?\n/).forEach(line=>{
    const m = line.match(/^\s*([A-Za-z])[\.\)、．：:]\s*(.*)$/);
    if(m) out[m[1].toUpperCase()] = m[2].trim();
  });
  return out;
}
async function parseQuizExcel(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const sheetName = wb.SheetNames.find(n=>n.indexOf('說明')===-1) || wb.SheetNames[0];
  const sheetIndex = wb.SheetNames.indexOf(sheetName);
  const ws = wb.Sheets[sheetName];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  if(!aoa.length) throw new Error('工作表是空的');
  const header = aoa[0].map(h=>String(h==null?'':h).trim());
  const need = ['編號','來源檔案','分類/班別','題型','題目','題目圖片','選項文字','選項圖片A','選項圖片B','選項圖片C','選項圖片D','答案','解析'];
  const colIdx = {};
  need.forEach(name=>{ colIdx[name] = header.indexOf(name); });
  if(colIdx['編號']===-1 || colIdx['題目']===-1){
    throw new Error('Excel 欄位格式不符，請確認欄位名稱（編號、題目…）與範本一致');
  }
  const zip = await JSZip.loadAsync(buf);
  const images = await extractXlsxImages(zip, sheetIndex);
  const questions = [];
  for(let r=1;r<aoa.length;r++){
    const row = aoa[r];
    if(!row || !row.some(c=>String(c==null?'':c).trim()!=='')) continue;
    const get = (name)=> colIdx[name]>-1 ? String(row[colIdx[name]]==null?'':row[colIdx[name]]).trim() : '';
    const no = get('編號');
    if(!no) continue;
    const rowImages = images[r] || {};
    questions.push({
      no,
      sourceFile: get('來源檔案'),
      category: get('分類/班別'),
      type: get('題型')==='複選' ? 'multi' : 'single',
      questionText: get('題目'),
      questionImageData: colIdx['題目圖片']>-1 ? (rowImages[colIdx['題目圖片']]||null) : null,
      optionsText: parseQuizOptionsText(get('選項文字')),
      optionImageData: {
        A: colIdx['選項圖片A']>-1 ? (rowImages[colIdx['選項圖片A']]||null) : null,
        B: colIdx['選項圖片B']>-1 ? (rowImages[colIdx['選項圖片B']]||null) : null,
        C: colIdx['選項圖片C']>-1 ? (rowImages[colIdx['選項圖片C']]||null) : null,
        D: colIdx['選項圖片D']>-1 ? (rowImages[colIdx['選項圖片D']]||null) : null,
      },
      answerText: get('答案'),
      explanation: get('解析'),
    });
  }
  return questions;
}
function parseQuizAnswerLetters(raw, validLetters){
  if(!raw) return [];
  const letters = String(raw).toUpperCase().match(/[A-Z]/g) || [];
  const allowed = validLetters && validLetters.length ? validLetters : ['A','B','C','D'];
  const out = [];
  letters.forEach(L=>{ if(allowed.includes(L) && !out.includes(L)) out.push(L); });
  return out;
}
async function saveQuizImageIfAny(dataUrl, oldAttId){
  if(!dataUrl){ return oldAttId || null; }
  const id = uid('qimg');
  await saveAttachmentDoc(id, {type:'image', name:'題庫圖片', data:dataUrl});
  if(oldAttId){ deleteAttachmentDoc(oldAttId).catch(()=>{}); }
  return id;
}
function quizAnswerLettersToText(q){
  return (q.correctAnswers||[]).join('');
}
function quizOptionsTextToRaw(q){
  const letters = quizOptionLetters(q);
  return letters.map(L=>{
    const txt = (q.optionsText && q.optionsText[L]) || '';
    return `${L}. ${txt}`;
  }).join('\n');
}
function exportQuizBankExcel(){
  const bank = DB.quizBank || [];
  if(!bank.length){ showToast('目前題庫是空的，沒有資料可以下載'); return; }
  const header = ['編號','來源檔案','分類/班別','題型','題目','題目圖片','選項文字','選項圖片A','選項圖片B','選項圖片C','選項圖片D','答案','解析'];

  ]);
  const aoa = [header, ...rows];

async function onQuizFileChange(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  S.quizImporting = true; renderApp();
  try{
    const parsed = await parseQuizExcel(file);
    let added=0, updated=0, answeredFromExcel=0;
    for(const q of parsed){
      const existingIdx = DB.quizBank.findIndex(x=>x.no===q.no);
      const existing = existingIdx>-1 ? DB.quizBank[existingIdx] : null;
      const questionImage = await saveQuizImageIfAny(q.questionImageData, existing && existing.questionImage);
      const optionImages = {};
      for(const L of ['A','B','C','D']){
        optionImages[L] = await saveQuizImageIfAny(q.optionImageData[L], existing && existing.optionImages && existing.optionImages[L]);
      }
      const validLetters = Object.keys(q.optionsText||{}).concat(Object.keys(q.optionImageData||{}).filter(L=>q.optionImageData[L]));
      const answerLetters = parseQuizAnswerLetters(q.answerText, validLetters.length ? [...new Set(validLetters)] : null);
      const type = answerLetters.length>1 ? 'multi' : q.type;
      const record = {
        id: existing ? existing.id : uid('q'),
        no: q.no, sourceFile: q.sourceFile, category: q.category, type,
        questionText: q.questionText, questionImage,
        optionsText: q.optionsText, optionImages,
        explanation: q.explanation,
        correctAnswers: answerLetters.length ? answerLetters : (existing ? (existing.correctAnswers||[]) : []),
        active: existing ? (existing.active!==false) : true,
      };
      if(answerLetters.length) answeredFromExcel++;
      if(existingIdx>-1){ DB.quizBank[existingIdx]=record; updated++; }
      else { DB.quizBank.push(record); added++; }
    }
    await persist();
    showToast(`匯入完成：新增 ${added} 題、更新 ${updated} 題（其中 ${answeredFromExcel} 題已從 Excel 帶入答案）`);
  }catch(e){
    console.error('題庫匯入失敗', e);
    showToast('匯入失敗：'+(e&&e.message?e.message:'請確認檔案格式'));
  }
  S.quizImporting = false;
  renderApp();
}

/* ---- 學員作答 ---- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// 把解析文字拆成「一個選項一行」：
// 1) 原本就用換行分開的各選項說明（例如「A. xxx\nB. xxx」）會各自成一行。
// 2) 同一行內用「(A)(B)(D)xxx」或「A/B. xxx」這種方式把多個選項寫在一起說明時，
//    會拆成 A、B、D 各自獨立一行，並且都完整帶上同一段說明文字（不是只留代號）。
// 3) 沒有標示選項代號的一般敘述（例如整段說明跟特定選項無關），維持原樣一行。
function formatExplanationParagraphs(text){
  if(!text) return [];
  const rawLines = String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  rawLines.forEach(line=>{
    const re = /(?:\([A-Za-z]\))+/g;
    let m, matches = [];
    while((m = re.exec(line))){ matches.push({index:m.index, text:m[0]}); }
    if(matches.length){
      if(matches[0].index>0){
        const lead = line.slice(0, matches[0].index).trim();
        if(lead) out.push(lead);
      }
      matches.forEach((mt,i)=>{
        const start = mt.index, end = i+1<matches.length ? matches[i+1].index : line.length;
        const letters = mt.text.match(/[A-Za-z]/g) || [];
        const body = line.slice(start+mt.text.length, end).trim();
        letters.forEach(L=> out.push(body ? `${L}：${body}` : `${L}`));
      });
      return;
    }
    const single = line.match(/^([A-Za-z](?:[\/,、][A-Za-z])*)[\.\)、．：:]\s*(.*)$/);
    if(single){
      const letters = single[1].split(/[\/,、]/).filter(Boolean);
      const body = single[2].trim();
      letters.forEach(L=> out.push(body ? `${L}：${body}` : `${L}`));
      return;
    }
    out.push(line);
  });
  return out.filter(Boolean);
}
function renderExplanationBlock(text){
  const paras = formatExplanationParagraphs(text);
  if(!paras.length) return '';
  return `<div class="hint-banner" style="background:var(--sky);color:var(--sky-ink);margin-top:8px;display:block;">
    <b>解析：</b>
    ${paras.map(p=>`<div style="margin-top:4px;">${escAttr(p)}</div>`).join('')}
  </div>`;
}
async function startStationQuiz(stationId){
  const cats = stationQuizCategories(stationId);
  if(!cats.length){ showToast('本站尚未設定題庫分類對應，請聯絡管理者到後台「題庫管理」設定'); return; }
  const pool = (DB.quizBank||[]).filter(q=> cats.includes(q.category) && q.active!==false && q.correctAnswers && q.correctAnswers.length);
  if(!pool.length){ showToast('本站題庫目前沒有可用的題目（尚未設定正確答案）'); return; }
  const picked = shuffleArray(pool).slice(0, Math.min(5, pool.length));
  showToast('載入考題中…');
  await prefetchQuizImages(picked);
  S.quiz = { stationId, questions: picked, answers:{}, submitted:false, result:null };
  S.view = 'quiz';
  renderApp();
  window.scrollTo(0,0);
}
function selectQuizAnswer(qId, letter, type){
  if(!S.quiz || S.quiz.submitted) return;
  const arr = S.quiz.answers[qId] ? S.quiz.answers[qId].slice() : [];
  if(type==='multi'){
    const idx = arr.indexOf(letter);
    if(idx>-1) arr.splice(idx,1); else arr.push(letter);
  }else{
    arr.length = 0; arr.push(letter);
  }
  S.quiz.answers[qId] = arr;
  renderApp();
}
function submitQuiz(){
  const quiz = S.quiz;
  if(!quiz || quiz.submitted) return;
  let score = 0;
  const detail = quiz.questions.map(q=>{
    const picked = (quiz.answers[q.id]||[]).slice().sort();
    const correct = (q.correctAnswers||[]).slice().sort();
    const isCorrect = picked.length===correct.length && picked.every((v,i)=>v===correct[i]);
    if(isCorrect) score++;
    return {qId:q.id, isCorrect, picked};
  });
  quiz.submitted = true;
  quiz.result = {score, total: quiz.questions.length, detail};
  const user = currentUser();
  const st = findStation(quiz.stationId);
  if(!DB.quizAttempts) DB.quizAttempts=[];
  // 把每題的完整內容（題目/選項/圖片參照/正確答案/作答內容/解析）存成快照，
  // 這樣即使之後題庫被修改或刪除，學員與管理者仍能回顧當初考核的完整內容與錯題解析。
  DB.quizAttempts.push({
    id:uid('qa'),
    stationId:quiz.stationId,
    stationName: st?st.name:'（未知站別）',
    traineeName: user?user.name:'',
    score, total: quiz.questions.length,
    date: todayStr(), ts: Date.now(),
    questions: quiz.questions.map(q=>{
      const d = detail.find(x=>x.qId===q.id);
      return {
        qId:q.id, category:q.category, type:q.type,
        questionText:q.questionText, questionImage:q.questionImage,
        optionsText:q.optionsText, optionImages:q.optionImages,
        correctAnswers:(q.correctAnswers||[]).slice(),
        picked: d.picked, isCorrect: d.isCorrect,
        explanation:q.explanation,
      };
    }),
  });
  persist();
  renderApp();
  window.scrollTo(0,0);
}

function editTeachingPoint(stId, tpId){

    <div class="modal-top"><h4>編輯教學重點</h4><button class="modal-close" onclick="closeModal()">✕</button></div>

    <button class="btn btn-ghost btn-block" style="margin-bottom:6px;" onclick="uploadTpAttachments('${stId}','${tpId}')">上傳選取的檔案</button>

function captureTpModalFields(){
  forceCommitActiveInput();
  return {
    title: document.getElementById('edit-tp-title').value.trim(),
    bullets: document.getElementById('edit-tp-bullets').value.split('\n').map(s=>s.trim()).filter(Boolean),
    image: document.getElementById('edit-tp-image').value.trim(),
  };
}
async function saveTeachingPoint(stId, tpId){
  const st = findStation(stId);
  const tp = st.teachingPoints.find(t=>t.id===tpId);
  const f = captureTpModalFields();
  tp.title = f.title || tp.title;
  tp.bullets = f.bullets;
  tp.image = f.image;
  await persist(); closeModal(); showToast('已儲存教學重點');
}
function setUploadStatus(elId, html){
  const el = document.getElementById(elId);
  if(el) el.innerHTML = html;
}
async function uploadTpAttachments(stId, tpId){
  const input = document.getElementById('tp-att-input');
  const files = Array.from((input && input.files) || []);
  if(!files.length){ setUploadStatus('tp-att-status', '<p style="color:var(--danger);font-size:11.5px;">請先選擇檔案</p>'); return; }
  setUploadStatus('tp-att-status', '<p style="color:var(--ink-soft);font-size:11.5px;">上傳中，請稍候…</p>');
  const st = findStation(stId);
  const tp = st.teachingPoints.find(t=>t.id===tpId);
  const f = captureTpModalFields();
  tp.title = f.title || tp.title; tp.bullets = f.bullets; tp.image = f.image;
  const newAtts = [];
  const errors = [];
  for(const file of files){
    if(file.size > MAX_ATTACHMENT_BYTES){ errors.push(`${file.name} 超過 ${humanFileSize(MAX_ATTACHMENT_BYTES)}`); continue; }
    try{ newAtts.push(await processUploadedFile(file)); }
    catch(e){ console.error(e); errors.push(`${file.name} 上傳失敗：${e.message||e}`); }
  }
  tp.attachments = (tp.attachments||[]).concat(newAtts);
  await persist();
  editTeachingPoint(stId, tpId);
  const summary = errors.length
    ? `<p style="color:var(--danger);font-size:11.5px;">已上傳 ${newAtts.length} 個檔案；失敗：${errors.join('；')}</p>`
    : `<p style="color:var(--primary-dk);font-size:11.5px;">✓ 已上傳 ${newAtts.length} 個檔案</p>`;
  setUploadStatus('tp-att-status', summary);
}
async function deleteAttachmentAndPages(att){
  if(!att) return;
  if(att.type==='pdf'){
    for(let i=1;i<=(att.pageCount||0);i++){ await deleteAttachmentDoc(`${att.id}_p${i}`); }
  }
  await deleteAttachmentDoc(att.id);
}
async function removeTpAttachment(stId, tpId, attId){
  const st = findStation(stId);
  const tp = st.teachingPoints.find(t=>t.id===tpId);
  const removed = (tp.attachments||[]).find(a=>a.id===attId);
  const f = captureTpModalFields();
  tp.title = f.title || tp.title; tp.bullets = f.bullets; tp.image = f.image;
  tp.attachments = (tp.attachments||[]).filter(a=>a.id!==attId);
  await persist();
  deleteAttachmentAndPages(removed);
  editTeachingPoint(stId, tpId);
}

async function addCategory(stId){
  const st = findStation(stId);
  // 新分類要插在「異常事件記錄」之前，不要接在它後面
  const incidentIdx = st.categories.findIndex(c=>c.isIncident);
  const newCat = {id:uid('c'), title:'新分類', items:[]};
  if(incidentIdx>-1) st.categories.splice(incidentIdx, 0, newCat);
  else st.categories.push(newCat);
  await persist(); renderApp();
}
async function moveCategory(stId, catId, direction){
  const st = findStation(stId);
  const normal = st.categories.filter(c=>!c.isIncident);
  const incident = st.categories.filter(c=>c.isIncident);
  const idx = normal.findIndex(c=>c.id===catId);
  const newIdx = idx + direction;
  if(idx<0 || newIdx<0 || newIdx>=normal.length) return;
  const tmp = normal[idx]; normal[idx] = normal[newIdx]; normal[newIdx] = tmp;
  st.categories = normal.concat(incident);
  await persist(); renderApp();
}
async function moveItem(stId, catId, itemId, direction){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const idx = cat.items.findIndex(i=>i.id===itemId);
  const newIdx = idx + direction;
  if(idx<0 || newIdx<0 || newIdx>=cat.items.length) return;
  const tmp = cat.items[idx]; cat.items[idx] = cat.items[newIdx]; cat.items[newIdx] = tmp;
  await persist(); renderApp();
}
function renameCategory(stId, catId){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const name = prompt('分類名稱', cat.title);
  if(name && name.trim()){ cat.title = name.trim(); persist(); renderApp(); }
}
async function deleteCategory(stId, catId){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  if(cat && cat.isIncident){ showToast('異常事件記錄分類無法刪除'); return; }
  st.categories = st.categories.filter(c=>c.id!==catId);
  await persist(); renderApp();
}
async function addItem(stId, catId){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  cat.items.push({id:uid('i'), text:'新檢核項目', important:false, detail:null});

async function deleteItem(stId, catId, itemId){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  cat.items = cat.items.filter(i=>i.id!==itemId);

function migrateDetailToSections(d){
  if(!d) return [];
  if(d.sections && d.sections.length) return d.sections.map(s=>({title:s.title||'', text:s.text||'', attachments:s.attachments||[]}));
  const legacyText = (d.steps||[]).join('\n');
  if(d.summary || legacyText) return [{title:d.summary||'', text:legacyText, attachments:[]}];
  return [];
}

      ${renderAdminAttachmentChips(s.attachments, `removeSectionAttachment('${stId}','${catId}','${itemId}',${i},`, `moveSectionAttachment('${stId}','${catId}','${itemId}',${i},`)}
      <input type="file" id="section-att-input-${i}" accept="image/*,.pdf,.doc,.docx" multiple style="width:100%;margin-bottom:6px;">
      <button type="button" class="btn btn-ghost btn-sm btn-block" onclick="uploadSectionAttachments('${stId}','${catId}','${itemId}',${i})">上傳此項附件</button>
      <div id="section-att-status-${i}" style="margin-top:4px;"></div>

function forceCommitActiveInput(){
  // 中文/日文等輸入法連續輸入時，若按鈕在「選字尚未確定」的當下被按下，
  // 讀取到的 value 會漏掉還沒確定的字。這裡強制讓目前聚焦的輸入框先失焦、
  // 逼輸入法把選字送出確定，再進行讀取，避免存檔漏字。
  if(document.activeElement && typeof document.activeElement.blur === 'function'){
    document.activeElement.blur();
  }
}
function readSectionsFromModal(){
  forceCommitActiveInput();
  const titles = Array.from(document.querySelectorAll('.section-title-input'));
  const texts = Array.from(document.querySelectorAll('.section-text-input'));
  return titles.map((t,i)=>({
    title: t.value.trim(),
    text: (texts[i]?texts[i].value.trim():''),
    attachments: (editingItemSections[i] && editingItemSections[i].attachments) || []
  })).filter(s=>s.title || s.text || (s.attachments && s.attachments.length));
}

let editingItemSections = [];

function editItem(stId, catId, itemId, sectionsOverride){
  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  const d = item.detail || {image:'', attachments:[]};
  editingItemSections = sectionsOverride || migrateDetailToSections(item.detail);
  openModal(`
    <div class="modal-top"><h4>編輯檢核項目</h4><button class="modal-close" onclick="closeModal()">✕</button></div>

async function uploadSectionAttachments(stId, catId, itemId, sectionIdx){
  const input = document.getElementById('section-att-input-'+sectionIdx);
  const files = Array.from((input && input.files) || []);
  const statusId = 'section-att-status-'+sectionIdx;
  if(!files.length){ setUploadStatus(statusId, '<p style="color:var(--danger);font-size:11px;">請先選擇檔案</p>'); return; }
  setUploadStatus(statusId, '<p style="color:var(--ink-soft);font-size:11px;">上傳中，請稍候…</p>');
  const current = readSectionsFromModal();
  if(!current[sectionIdx]){ setUploadStatus(statusId, '<p style="color:var(--danger);font-size:11px;">請先填寫此提醒事項的標題或說明再上傳</p>'); return; }
  const newAtts = [];
  const errors = [];
  for(const file of files){
    if(file.size > MAX_ATTACHMENT_BYTES){ errors.push(`${file.name} 超過 ${humanFileSize(MAX_ATTACHMENT_BYTES)}`); continue; }
    try{ newAtts.push(await processUploadedFile(file)); }
    catch(e){ console.error(e); errors.push(`${file.name} 上傳失敗：${e.message||e}`); }
  }
  current[sectionIdx].attachments = (current[sectionIdx].attachments||[]).concat(newAtts);
  refreshItemSectionsUI(stId, catId, itemId, current);
  const summary = errors.length
    ? `<p style="color:var(--danger);font-size:11px;">已上傳 ${newAtts.length} 個；失敗：${errors.join('；')}</p>`
    : `<p style="color:var(--primary-dk);font-size:11px;">✓ 已上傳 ${newAtts.length} 個檔案</p>`;
  setUploadStatus('section-att-status-'+sectionIdx, summary);
}

async function uploadItemAttachments(stId, catId, itemId){
  const input = document.getElementById('item-att-input');
  const files = Array.from((input && input.files) || []);
  if(!files.length){ setUploadStatus('item-att-status', '<p style="color:var(--danger);font-size:11.5px;">請先選擇檔案</p>'); return; }
