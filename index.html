  const st = findStation(stId);
  const cat = st.categories.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  const prevAttachments = (item.detail && item.detail.attachments) || [];
  const newAtts = [];
  const errors = [];
  for(const file of files){
    if(file.size > MAX_ATTACHMENT_BYTES){ errors.push(`${file.name} 超過 ${humanFileSize(MAX_ATTACHMENT_BYTES)}`); continue; }
    try{ newAtts.push(await processUploadedFile(file)); }
    catch(e){ console.error(e); errors.push(`${file.name} 上傳失敗：${e.message||e}`); }
  }
  const mergedAttachments = prevAttachments.concat(newAtts);
  if(!item.detail) item.detail = { sections:[], image:'', attachments:[] };
  item.detail.attachments = mergedAttachments;
  await persist();
  const chipsEl = document.getElementById('item-attachments-chips');
  if(chipsEl) chipsEl.innerHTML = renderAdminAttachmentChips(mergedAttachments, `removeItemAttachment('${stId}','${catId}','${itemId}',`, `moveItemAttachment('${stId}','${catId}','${itemId}',`);

  const summary = errors.length
    ? `<p style="color:var(--danger);font-size:11.5px;">已上傳 ${newAtts.length} 個檔案；失敗：${errors.join('；')}</p>`

async function fetchBackupList(){
  if(!firebaseReady) return [];
  try{
    const snap = await firestoreDb.collection(BACKUPS_COLLECTION).get();
    return snap.docs.map(d=>({id:d.id, backedUpAt:d.data()._backedUpAt||''})).sort((a,b)=>b.id.localeCompare(a.id));
  }catch(e){ console.error('讀取備份清單失敗', e); return []; }
}
function renderAdminBackup(){
  if(S.backupLoading){
    return `<p style="font-size:12.5px;color:var(--ink-soft);padding:20px 0;text-align:center;">正在讀取備份清單…</p>`;
  }
  const list = S.backupList || [];
  return `
    <p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;">系統每天第一次存檔前，會自動把「當天開始前」的完整資料庫內容備份下來，最多保留最近 30 天。如果資料不小心被覆蓋或誤刪，可以在這裡選一個日期還原。</p>
    <button class="btn btn-outline btn-block" style="margin-bottom:10px;" onclick="setAdminTab('backup')">🔄 重新整理清單</button>
    ${list.length ? list.map(b=>`
      <div class="admin-item-row">
        <div class="t">📦 ${b.id}${b.backedUpAt?` <span style="color:var(--ink-soft);font-size:11px;">(${new Date(b.backedUpAt).toLocaleString('zh-TW')} 備份)</span>`:''}</div>
        <button class="mini-x" style="color:var(--primary-dk);" onclick="restoreFromBackup('${b.id}')">還原到此</button>
      </div>`).join('') : '<p style="font-size:12.5px;color:var(--ink-soft);">目前還沒有任何備份（今天是第一次使用備份功能，明天之後就會開始累積）。</p>'}
  `;
}
async function restoreFromBackup(dateId){
  if(!confirm(`確定要把資料庫還原到「${dateId}」那天開始前的狀態嗎？\n\n這會覆蓋掉現在的所有資料（包含還原之後才做的修改），此動作無法復原，請先確認清楚。`)) return;
  try{
    const doc = await firestoreDb.collection(BACKUPS_COLLECTION).doc(dateId).get();
    if(!doc.exists){ showToast('找不到這份備份'); return; }
    const data = doc.data();
    delete data._backedUpAt;
    DB = data;
    migrateDB();
    await persist({overwrite:true});
    S.adminTab = 'stations';
    renderApp();
    showToast(`已還原到 ${dateId} 的備份`);
  }catch(e){
    console.error('還原失敗', e);
    showToast('還原失敗，請檢查網路連線');
  }
}

  const trainees = DB.employees.filter(e=>e.role==='trainee');

  if(!trainees.length){

  const picker = `
    <div class="form-group">
      <label>選擇學員</label>
      <select onchange="setHistoryTraineeFilter(this.value)">
        <option value="">請選擇學員</option>

      </select>

    return `${picker}<p style="font-size:12.5px;color:var(--ink-soft);margin-top:10px;">選擇一位學員以查看學習歷程。</p>`;
  }

  const name = S.historyTraineeFilter;
  const stationSummary = DB.stations.map(st=>{
    const total = totalItems(st);
    if(!total) return null;
    const done = checkedCount(st, name);
    return {st, done, total, pct: percentDone(st, name)};
  }).filter(Boolean);

  const summaryHtml = stationSummary.length ? stationSummary.map(s=>{
    const locked = !!(DB.progressLocks && DB.progressLocks[progressKey(s.st.id, name)]);
    return `
    <div class="admin-item-row">
      <div class="t">${s.st.emoji} <b>${s.st.name}</b>（${s.st.code}） · ${s.done}/${s.total} 項（${s.pct}%）${s.done===0?' <span style="color:var(--ink-soft);">尚未開始</span>':''}${locked?' <span class="pill-tag tag-mint">🎓 已完訓鎖定</span>':''}</div>

    </div>`;
  }).join('') : '<p style="font-size:12.5px;color:var(--ink-soft);">尚無任何站別資料。</p>';

  const logEntries = (DB.learningLog||[])
    .filter(l=>l.traineeName===name && l.checked)
    .sort((a,b)=>b.timestamp.localeCompare(a.timestamp));

  // 依站別分組顯示詳細紀錄
  const logByStation = {};
  logEntries.forEach(l=>{
    if(!logByStation[l.stationName]) logByStation[l.stationName] = [];
    logByStation[l.stationName].push(l);
  });
  const stationNamesWithLogs = Object.keys(logByStation);

  const logHtml = stationNamesWithLogs.length ? stationNamesWithLogs.map(stName=>{
    const rows = logByStation[stName].map(l=>`

        <td>${l.date}</td>
        <td>${l.itemText}</td>
        <td>${l.mentor || '（無自動配對紀錄）'}</td>
      </tr>`).join('');
    return `
      <div class="subhead" style="margin-top:14px;font-size:12px;">${stName}（${logByStation[stName].length} 項）</div>
      <div style="overflow-x:auto;">

          <thead><tr><th>日期</th><th>項目</th><th>當時導師</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('') : '<p style="font-size:12.5px;color:var(--ink-soft);">尚無紀錄。</p>';

  return `
    ${picker}
    <div class="subhead" style="margin-top:14px;">進度總覽（所有站別）</div>
    ${summaryHtml}
    <div class="subhead">考核紀錄</div>
    ${renderTraineeQuizAttemptsAdmin(name)}

    ${logHtml}

function renderTraineeQuizAttemptsAdmin(name){
  const attempts = traineeQuizAttempts(name);
  if(!attempts.length) return '<p style="font-size:12.5px;color:var(--ink-soft);">尚無考核紀錄。</p>';
  return attempts.map(renderQuizAttemptRow).join('');
}

async function addEmployee(){
  const empNo = document.getElementById('new-emp-no').value.trim();
  const name = document.getElementById('new-emp-name').value.trim();
  const role = document.getElementById('new-emp-role').value;
  if(!empNo || !name){ showToast('請填寫員編與姓名'); return; }
  if(findEmployeeByEmpNo(empNo)){ showToast('此員編已存在'); return; }
  DB.employees.push({id:uid('emp'), empNo, name, role});
  await persist(); renderApp(); showToast('已新增人員');
}
async function updateEmployeeRole(id, role){
  const e = DB.employees.find(x=>x.id===id);
  if(!e) return;
  e.role = role;
  await persist(); renderApp();
}
async function deleteEmployee(id){
  DB.employees = DB.employees.filter(e=>e.id!==id);
  if(sessionUserId===id) sessionUserId=null;
  await persist(); renderApp();
}
async function addCodeMap(){
  const code = document.getElementById('new-code-text').value.trim();
  const stationId = document.getElementById('new-code-station').value;
  if(!code){ showToast('請輸入班表代碼'); return; }
  DB.codeMap.push({id:uid('cm'), code, stationId});
  await persist(); renderApp(); showToast('已新增對照');
}
async function deleteCodeMap(id){
  DB.codeMap = DB.codeMap.filter(c=>c.id!==id);
  await persist(); renderApp();
}

let loginError = '';
function renderLogin(){
  return `
    <div class="view" style="padding-top:50px;">
      <div class="rx-mark" style="width:52px;height:52px;font-size:26px;margin:0 auto 28px;">℞</div>

        <div class="login-id-row">
          <span class="login-y-badge">Y</span>
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="5" id="login-empno" class="login-id-input" placeholder="00000" oninput="onLoginIdInput()" onkeydown="if(event.key==='Enter')doLogin()" autofocus>
        </div>

        <label class="login-field-label" style="margin-top:16px;">員工姓名（自動帶入）</label>
        <div class="login-name-box" id="login-name-preview">輸入員編後自動顯示</div>

        ${loginError ? `<p style="color:var(--danger);font-size:12px;margin:10px 0 0;">${loginError}</p>` : ''}
        <button class="btn btn-primary btn-block" style="margin-top:20px;min-height:52px;font-size:15px;" onclick="doLogin()">登入系統</button>
      </div>
    </div>`;
}
function lookupByDigits(digits){
  if(!digits) return null;
  const padded = digits.padStart(5,'0');
  return findEmployeeByEmpNo('Y'+padded) || null;
}
function onLoginIdInput(){
  const input = document.getElementById('login-empno');
  const cleaned = input.value.replace(/[^0-9]/g,'').slice(0,5);
  if(input.value !== cleaned) input.value = cleaned;
  const box = document.getElementById('login-name-preview');
  const digits = input.value;
  if(!digits){
    box.textContent = '輸入員編後自動顯示';
    box.classList.remove('resolved','notfound');
    return;
  }
  const emp = lookupByDigits(digits);
  if(emp){
    box.textContent = emp.name;
    box.classList.add('resolved');
    box.classList.remove('notfound');
  }else{
    box.textContent = digits.length===5 ? '查無此員編' : '輸入員編後自動顯示';
    box.classList.remove('resolved');
    box.classList.toggle('notfound', digits.length===5);
  }
}
async function doLogin(){
  const raw = (document.getElementById('login-empno').value||'').trim();
  const digits = raw.replace(/[^0-9]/g,'');
  if(!digits){ loginError='請輸入員編數字'; renderApp(); return; }
  const padded = digits.padStart(5,'0');
  const candidate = 'Y'+padded;
  let emp = findEmployeeByEmpNo(candidate) || findEmployeeByEmpNo(raw) || findEmployeeByEmpNo(digits);
  if(!emp){ loginError='查無此員編，請確認後再試一次'; renderApp(); return; }
  loginError='';
  sessionUserId = emp.id; // 只存在記憶體裡，不寫進資料庫
  await enterTodayView();
}
async function doLogout(){
  sessionUserId = null;
  S.adminUnlocked = false; // 登出後，下一位使用者要重新輸入後台密碼
  renderApp();
}

function showFatalError(title, detail){
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px;margin:40px auto;padding:20px;font-family:sans-serif;">
      <div style="background:#FBE4DF;border:1px solid #C0432F;border-radius:12px;padding:18px 20px;color:#7A241A;">
        <b style="font-size:15px;">⚠ ${title}</b>
        <p style="font-size:13px;line-height:1.6;margin:10px 0 0;white-space:pre-wrap;">${detail}</p>
        <p style="font-size:11.5px;margin:14px 0 0;color:#8A3A2C;">提示：如果是用滑鼠雙擊直接開啟這個檔案（網址列開頭是 file:///），請改成部署到網站上（例如 GitHub Pages）後用 https:// 網址開啟再試一次。</p>
      </div>
    </div>`;
}

(async function init(){
  document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#5B6B65;font-family:sans-serif;">載入中...</div>';
  try{
    if(typeof firebase === 'undefined'){
      showFatalError('Firebase 程式庫載入失敗', 'firebase-app-compat.js 等外部程式庫沒有成功載入，可能是網路連線問題，或瀏覽器/防火牆擋住了 gstatic.com。請檢查網路連線後重新整理頁面。');
      return;
    }
    initScheduleFirebase().catch(e=>console.error('班表系統連線初始化失敗（不影響主要功能）', e));
    await withTimeout(loadDB(), 12000, '資料庫連線');
    const dow = new Date().getDay();
    S.stationsTab = dow===6 ? 'sat' : (dow===0 ? 'sun' : 'weekday');
    renderApp();
  }catch(e){
    console.error('App 初始化失敗', e);
    showFatalError('載入失敗', '錯誤訊息：' + (e && e.message ? e.message : String(e)));
  }
})();
</script>
